        <td class="r mono">${PKR(x.unit)}</td><td class="r mono ${dg(x.unit-c.panUnit)}">${(x.unit-c.panUnit>=0?'+':'')+PKR(x.unit-c.panUnit).replace('PKR ','')}</td></tr>`).join('')}
      </tbody></table></div></div>`;
}

/* =====================================================================
   PAGE: MENU ENGINEERING
   ===================================================================== */
function pageMenu(){
  const m=M(); if(!m){ $('#p-menu').innerHTML=empty(); return; }
  const c=metrics(m), p=metrics(P()), pl=P()?P().label:'';
  const pts = c.sku.filter(s=>s.qty>=3).map(s=>({x:s.qty,y:s.margin,net:s.net,qty:s.qty,quad:s.quad,label:s.key}));
  const prevQ = p? new Map(p.sku.map(s=>[s.key,s.quad])) : new Map();
  const migrated = p? c.sku.filter(s=>prevQ.has(s.key) && prevQ.get(s.key)!==s.quad)
      .map(s=>({...s, from:prevQ.get(s.key)})).sort((a,b)=>b.net-a.net) : [];
  const rank = {Star:3,'Plow-horse':2,Puzzle:1,Dog:0};
  const board = [...c.sku].sort((a,b)=> (rank[b.quad]-rank[a.quad]) || (b.net-a.net));
  const dogs = c.quads.Dog.filter(s=>s.qty<=8).sort((a,b)=>a.net-b.net).slice(0,20);
  const bundleA = c.quads['Plow-horse'].sort((a,b)=>b.qty-a.qty).slice(0,4);
  const bundleB = c.quads.Puzzle.sort((a,b)=>b.margin-a.margin).slice(0,4);

  const qCard = (name,cls,advice) => {
    const list=c.quads[name];
    return `<div class="card"><h3><span class="tag ${cls}">${name}</span> · ${NUM(list.length)} items</h3>
      <div class="cap">${PKRk(sum(list,s=>s.net))} of sales · ${PCT(sum(list,s=>s.net)/c.sales)} of the month</div>
      <p class="summary" style="font-size:13px;margin-bottom:10px">${advice}</p>
      <div class="tw" style="max-height:230px"><table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Net</th><th class="r">Margin/unit</th></tr></thead><tbody>
      ${list.sort((a,b)=>b.net-a.net).slice(0,25).map(s=>`<tr><td>${esc(s.key)}</td><td class="r mono">${NUM(s.qty)}</td>
        <td class="r mono">${PKR(s.net)}</td><td class="r mono">${PKR(s.margin)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  };

  $('#p-menu').innerHTML=`
    <div class="eyebrow">${esc(m.label)}</div><h1>Menu engineering</h1>
    <p class="lede">Every item is placed by how much it sells against how much it earns per unit.
    ${c.hasCosts? 'Margins here use the food costs you entered.'
      : 'No food costs entered yet, so profitability is a price proxy — item price against its own category average. Add costs in <b>Setup</b> for real margins.'}</p>

    ${!c.hasCosts? '<div class="note" style="margin-bottom:18px"><b>Add food costs to unlock real margin.</b> Enter a cost for your top 30 items in Setup and this whole page recalculates on contribution margin instead of price.</div>':''}

    <div class="grid g4" style="margin-bottom:18px">
      ${tile('D','Menu health score', c.health.score+' / 100', null)}
      ${tile('D','Star revenue share', PCT(c.starShare), p?{pct:(c.starShare-p.starShare)/(p.starShare||1),b:p.starShare}:null, pl, PCT)}
      ${tile('D','Dog count', NUM(c.quads.Dog.length), p?{pct:(c.quads.Dog.length-p.quads.Dog.length)/(p.quads.Dog.length||1),b:p.quads.Dog.length}:null, pl, NUM)}
      ${tile('D','Total contribution', c.hasCosts? PKRk(c.contribTotal):'add costs', null)}
    </div>

    <div class="card"><h3>The matrix</h3>
      <div class="cap">Bubble size is revenue. Hover any bubble for the item. ${NUM(pts.length)} items with 3+ units shown.</div>
      ${scatterMatrix(pts)}
      <div class="legend"><span><i style="background:#C79A00"></i>Star — keep, feature, protect price</span>
        <span><i style="background:${C.navy}"></i>Plow-horse — popular but cheap; bundle it up</span>
        <span><i style="background:#6B4E9E"></i>Puzzle — earns well, nobody orders it; promote or reposition</span>
        <span><i style="background:${C.flame}"></i>Dog — low volume, low earn; cut</span></div>
    </div>

    <div class="card"><h3>Menu health score — ${c.health.score}/100</h3>
      <div class="cap">Six sub-scores. The lowest bar is the one worth fixing first.</div>
      ${barChart(c.health.parts.map(x=>({key:x.k,value:Math.round(x.v*100),color:x.v<0.5?C.flame:(x.v<0.75?C.tape:C.moss)})),{fmt:x=>x+'/100'})}
      <hr class="h">
      <p class="summary">Weakest area: <b>${esc(c.health.parts.slice().sort((a,b)=>a.v-b.v)[0].k)}</b> —
      ${esc(c.health.parts.slice().sort((a,b)=>a.v-b.v)[0].hint.toLowerCase())}.</p></div>

    <div class="grid g2">
      ${qCard('Star','t-star','Protect these. Never discount them, keep them top-right on the menu board, and build every combo around them.')}
      ${qCard('Plow-horse','t-plow','High traffic, thin earn. Raise price carefully or attach a dip, drink or dessert to every one that goes out.')}
    </div>
    <div class="grid g2">
      ${qCard('Puzzle','t-puz','Good money, no takers. Move them onto the board, name them in upsell scripts, or make them a limited offer.')}
      ${qCard('Dog','t-dog','Cut them. Each one costs prep space, stock lines and menu attention for almost nothing back.')}
    </div>

    ${(()=>{ if(!c.hasCosts) return '';
      const proxy = compute(M(), {});
      const pm = new Map(proxy.sku.map(s=>[s.key,s.quad]));
      const flips = c.sku.filter(s=>pm.get(s.key) && pm.get(s.key)!==s.quad).sort((a,b)=>b.net-a.net);
      return `<div class="card"><h3>What real costs changed</h3>
        <div class="cap">Items that sit in a different quadrant once true food cost replaces the price proxy — these are your mispriced lines</div>
        ${flips.length? `<div class="tw" style="max-height:320px"><table><thead><tr><th>Item</th><th>On price alone</th><th>On real margin</th><th class="r">Margin/unit</th><th class="r">Contribution</th></tr></thead><tbody>
          ${flips.slice(0,30).map(s=>`<tr><td>${esc(s.key)}</td><td><span class="tag ${qcls(pm.get(s.key))}">${pm.get(s.key)}</span></td>
            <td><span class="tag ${qcls(s.quad)}">${s.quad}</span></td><td class="r mono">${PKR(s.margin)}</td>
            <td class="r mono">${s.contrib!=null?PKR(s.contrib):'—'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="summary" style="margin-top:10px"><b>${NUM(flips.length)}</b> items move once real cost is applied. Anything that fell out of Star
        is quietly expensive to make; anything that climbed into Star is earning more than the price tag suggests.</p>`
        : '<p class="mini">No item changes quadrant — your prices track your costs closely.</p>'}</div>`; })()}

    <div class="card"><h3>Quadrant migration</h3><div class="cap">Items that changed position since ${esc(pl||'—')}</div>
      ${p? (migrated.length? `<div class="tw" style="max-height:340px"><table><thead><tr><th>Item</th><th>Was</th><th>Now</th><th class="r">Net</th><th>Read</th></tr></thead><tbody>
        ${migrated.slice(0,30).map(s=>{ const up=rank[s.quad]>rank[s.from];
          return `<tr><td>${esc(s.key)}</td><td><span class="tag ${qcls(s.from)}">${s.from}</span></td>
          <td><span class="tag ${qcls(s.quad)}">${s.quad}</span></td><td class="r mono">${PKR(s.net)}</td>
          <td class="${up?'up':'down'}">${up?'▲ improving':'▼ slipping'}</td></tr>`}).join('')}
        </tbody></table></div>` : '<p class="mini">Nothing changed quadrant.</p>') : '<p class="mini">Load a second month to track migration.</p>'}</div>

    <div class="grid g2">
      <div class="card"><h3>Delist simulator</h3>
        <div class="cap">Cut the worst dogs and assume some volume walks to a neighbouring item</div>
        <div class="row" style="margin-bottom:10px">
          <label class="mini">Cut the bottom <input type="number" id="dsN" value="10" min="1" max="${dogs.length||1}" style="width:64px"> dogs</label>
          <label class="mini">Transfer rate <input type="number" id="dsT" value="40" min="0" max="100" style="width:64px">%</label>
          <button class="btn ghost sm" id="dsRun">Model it</button>
        </div>
        <div id="dsOut"></div>
      </div>
      <div class="card"><h3>Bundle builder</h3>
        <div class="cap">Pair a crowd-puller with a high-margin item that needs help</div>
        ${bundleA.length&&bundleB.length? bundleA.slice(0,3).map((a,i)=>{
          const b=bundleB[i%bundleB.length]; if(!b) return '';
          const list=a.unit+b.unit, price=Math.round(list*0.88/10)*10, marg=(a.margin+b.margin)-(list-price);
          return `<div class="script"><div class="sw">Bundle ${i+1}</div>
            <b>${esc(a.item)}</b> + <b>${esc(b.item)}</b><br>
            <span class="mono" style="font-size:12px">List ${PKR(list)} → bundle at <b>${PKR(price)}</b> (12% off) ·
            blended margin ${PKR(marg)} · break-even attach ${PCT(Math.max(0.02,(list-price)/Math.max(1,a.margin+b.margin)),0)} of ${esc(a.item)} orders</span></div>`;
        }).join('') : '<p class="mini">Not enough spread in the menu to suggest bundles.</p>'}
      </div>
    </div>

    <div class="card"><h3>Menu board priority</h3>
      <div class="cap">The eight that belong in the hot zone, and the ten to demote or remove</div>
      <div class="grid g2">
        <div><h4 class="eyebrow" style="color:var(--moss)">Promote — top right of the board</h4>
          <div class="tw" style="max-height:270px"><table><thead><tr><th>#</th><th>Item</th><th class="r">Net</th><th>Type</th></tr></thead><tbody>
          ${board.slice(0,8).map((s,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(s.key)}</td><td class="r mono">${PKR(s.net)}</td><td><span class="tag ${qcls(s.quad)}">${s.quad}</span></td></tr>`).join('')}
          </tbody></table></div></div>
        <div><h4 class="eyebrow" style="color:var(--flame)">Demote or delete</h4>
          <div class="tw" style="max-height:270px"><table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Net</th></tr></thead><tbody>
          ${board.slice(-10).reverse().map(s=>`<tr><td>${esc(s.key)}</td><td class="r mono">${NUM(s.qty)}</td><td class="r mono">${PKR(s.net)}</td></tr>`).join('')}
          </tbody></table></div></div>
      </div></div>`;

  const run=()=>{
    const n=clamp(+$('#dsN').value||10,1,dogs.length), t=clamp((+$('#dsT').value||40)/100,0,1);
    const cut=dogs.slice(0,n), lostRev=sum(cut,s=>s.net), kept=lostRev*t;
    $('#dsOut').innerHTML=`<div class="ok"><b>Cut ${n} items · lose ${PKR(lostRev)} · recover ${PKR(kept)} · net ${PKR(kept-lostRev)}</b><br>
      That is ${PCT((lostRev-kept)/c.sales,2)} of the month's sales, in exchange for ${n} fewer stock lines and prep steps.</div>
      <div class="tw" style="max-height:200px;margin-top:10px"><table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Net</th></tr></thead><tbody>
      ${cut.map(s=>`<tr><td>${esc(s.key)}</td><td class="r mono">${NUM(s.qty)}</td><td class="r mono">${PKR(s.net)}</td></tr>`).join('')}</tbody></table></div>`;
  };
  $('#dsRun').onclick=run; run();
}
function qcls(q){ return {'Star':'t-star','Plow-horse':'t-plow','Puzzle':'t-puz','Dog':'t-dog'}[q]||'t-plow'; }

/* =====================================================================
   PAGE: TRENDS  (KPI 31–34 across all months + anomalies)
   ===================================================================== */
function pageTrends(){
  if(!APP.months.length){ $('#p-trends').innerHTML=empty(); return; }
  const ms = APP.months, mets = ms.map(x=>compute(x,APP.costs));
  const labels = ms.map(x=>x.label.replace(/(\w{3})\w*\s(\d{4})/,'$1 $2'));
  const pd = perDay();
  const V = k => mets.map((x,i)=> pd? x[k]/ms[i].days : x[k]);

  // anomalies vs trailing average
  const anomalies=[];
  if(ms.length>=3){
    const last=mets[mets.length-1];
    const hist=mets.slice(0,-1);
    for(const s of last.sku){
      const prevVals = hist.map(h=>{const f=h.sku.find(y=>y.key===s.key); return f?f.qty:0;});
      const base = prevVals.reduce((a,b)=>a+b,0)/prevVals.length;
      if(base>=8){ const ch=(s.qty-base)/base; if(Math.abs(ch)>=0.30) anomalies.push({key:s.key,qty:s.qty,base:Math.round(base),ch,net:s.net}); }
    }
    anomalies.sort((a,b)=>Math.abs(b.ch*b.net)-Math.abs(a.ch*a.net));
  }
  // streaks
  const streak=(dir)=>{
    if(ms.length<3) return [];
    const last=mets[mets.length-1];
    return last.sku.filter(s=>{
      const series = mets.map(h=>{const f=h.sku.find(y=>y.key===s.key); return f?f.qty:0;});
      const t=series.slice(-3);
      return dir>0 ? (t[0]<t[1]&&t[1]<t[2]&&t[2]>=10) : (t[0]>t[1]&&t[1]>t[2]&&t[0]>=10);
    }).sort((a,b)=>b.net-a.net).slice(0,10);
  };
  const rising=streak(1), falling=streak(-1);

  const catNames = [...new Set(mets.flatMap(x=>x.byCat.map(c=>c.key)))].slice(0,6);
  const catSeries = catNames.map(n=>({name:n, values:mets.map((x,i)=>{const c=x.byCat.find(y=>y.key===n); const v=c?c.net:0; return pd? v/ms[i].days : v;})}));

  const canni = pageTrendsCanni(mets);
  const seasons = ms.map((x,i)=>({m:x, tags:seasonTags(x)})).filter(x=>x.tags.length);
  const exec = (()=>{
    if(mets.length<2) return 'One month loaded. Add the previous month and this paragraph writes itself: direction, cause, and the item doing the most damage or good.';
    const a=mets[mets.length-1], b=mets[mets.length-2];
    const la=ms[ms.length-1], lb=ms[ms.length-2];
    const g=((a.sales/la.days)-(b.sales/lb.days))/(b.sales/lb.days);
    const pm=new Map(b.sku.map(x=>[x.key,x]));
    const mv=a.sku.map(x=>({k:x.key,d:x.net-((pm.get(x.key)||{}).net||0)}));
    const best=[...mv].sort((x,y)=>y.d-x.d)[0], worst=[...mv].sort((x,y)=>x.d-y.d)[0];
    const bestCat=a.byCat.map(x=>{const q=b.byCat.find(y=>y.key===x.key); return {k:x.key,d:x.revShare-(q?q.net/b.sales:0)}}).sort((x,y)=>y.d-x.d)[0];
    return `Sales per day moved <b>${g>=0?'up':'down'} ${(Math.abs(g)*100).toFixed(1)}%</b> from ${esc(lb.label)} to ${esc(la.label)}, landing at ${PKR(a.sales)}.
      Orders went ${a.orders>=b.orders?'up':'down'} <b>${NUM(Math.abs(a.orders-b.orders))}</b> and the basket went ${a.aov>=b.aov?'up':'down'} <b>${PKR(Math.abs(a.aov-b.aov))}</b>.
      The mix drifted toward <b>${esc(bestCat.k)}</b> (${PP(bestCat.d)}). Biggest single gain: <b>${esc(best.k)}</b> at ${PKR(best.d)}.
      Biggest single loss: <b>${esc(worst.k)}</b> at ${PKR(worst.d)}.
      ${canni.length? 'There are <b>'+canni.length+'</b> signs of one variant eating another rather than new demand — see below.' : 'No sibling cannibalisation detected, so movement looks like real demand rather than customers switching variants.'}`;
  })();

  $('#p-trends').innerHTML=`
    <div class="eyebrow">${ms.length} month${ms.length>1?'s':''} loaded${pd?' · per day':''}</div><h1>Trends</h1>
    <p class="lede">${ms.length<2? 'Load at least two months to see a trend line. Everything below fills in automatically as you add files.'
      : 'Month-on-month movement across sales, orders and basket size, plus the items swinging hardest against their own history.'}</p>

    <div class="card"><h3>Executive summary</h3><div class="cap">Written from the loaded months, no input needed</div>
      <p class="summary">${exec}</p></div>

    <div class="grid g2">
      <div class="card"><h3>Net food sales</h3><div class="cap">KPI 31</div>
        ${lineChart([{name:'Net sales',values:V('sales'),color:C.flame}],labels,{fmt:PKRk})}</div>
      <div class="card"><h3>Orders</h3><div class="cap">KPI 32</div>
        ${lineChart([{name:'Orders',values:V('orders'),color:C.navy}],labels,{fmt:NUM})}</div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>Average order value</h3><div class="cap">KPI 33</div>
        ${lineChart([{name:'AOV',values:mets.map(x=>x.aov),color:C.moss}],labels,{fmt:PKR})}</div>
      <div class="card"><h3>Attach rates</h3><div class="cap">KPI 25–28 over time</div>
        ${lineChart([
          {name:'Sides',values:mets.map(x=>x.atSides*100)},
          {name:'Drinks',values:mets.map(x=>x.atDrink*100)},
          {name:'Desserts',values:mets.map(x=>x.atDess*100)},
          {name:'Dips',values:mets.map(x=>x.atDip*100)}],labels,{fmt:x=>x.toFixed(0)+'%'})}</div>
    </div>

    <div class="card"><h3>Category trend</h3><div class="cap">KPI 34 · where the mix is drifting</div>
      ${lineChart(catSeries,labels,{fmt:PKRk})}</div>

    <div class="grid g3">
      <div class="card"><h3>Rising</h3><div class="cap">Three months of gains</div>
        ${rising.length? rising.map(s=>`<div style="padding:5px 0;border-bottom:1px solid var(--hair)"><b style="font-size:12.5px">${esc(s.key)}</b><br><span class="mono" style="font-size:11px;color:var(--moss)">${NUM(s.qty)} units · ${PKR(s.net)}</span></div>`).join('') : '<p class="mini">Needs three months.</p>'}</div>
      <div class="card"><h3>Falling</h3><div class="cap">Three months of decline</div>
        ${falling.length? falling.map(s=>`<div style="padding:5px 0;border-bottom:1px solid var(--hair)"><b style="font-size:12.5px">${esc(s.key)}</b><br><span class="mono" style="font-size:11px;color:var(--flame)">${NUM(s.qty)} units · ${PKR(s.net)}</span></div>`).join('') : '<p class="mini">Needs three months.</p>'}</div>
      <div class="card"><h3>Anomalies</h3><div class="cap">Swinging over 30% against their own average</div>
        ${anomalies.length? anomalies.slice(0,10).map(a=>`<div style="padding:5px 0;border-bottom:1px solid var(--hair)"><b style="font-size:12.5px">${esc(a.key)}</b><br>
          <span class="mono ${dg(a.ch)}" style="font-size:11px">${arrow(a.ch)} ${(a.ch*100).toFixed(0)}% · ${NUM(a.qty)} vs ${NUM(a.base)} usual</span></div>`).join('') : '<p class="mini">Needs three months.</p>'}</div>
    </div>

    <div class="grid g2">
      <div class="card"><h3>Cannibalisation watch</h3>
        <div class="cap">One size or crust climbing while a sibling falls, with the family total flat — that is switching, not growth</div>
        ${canni.length? canni.map(x=>`<div class="script" style="border-left-color:var(--tape)">
            <div class="sw">${esc(x.item)} · family total ${NUM(x.total)} units, moved ${PCT(x.swing,1)}</div>
            <span class="up mono" style="font-size:12px">▲ ${esc(x.up)} +${NUM(x.upD)}</span><br>
            <span class="down mono" style="font-size:12px">▼ ${esc(x.down)} ${NUM(x.downD)}</span></div>`).join('')
          : '<p class="mini">'+(mets.length<2?'Load a second month.':'Nothing detected — movement looks like real demand.')+'</p>'}</div>
      <div class="card"><h3>Seasonality</h3>
        <div class="cap">Trading events that land inside your loaded periods. Dates are approximate — moon sighting shifts them by a day or two.</div>
        ${seasons.length? seasons.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--hair)">
            <b>${esc(x.m.label)}</b><br>${x.tags.map(t=>'<span class="tag t-plow" style="margin:4px 4px 0 0">'+esc(t.k)+'</span>').join('')}
            <div class="mini" style="margin-top:5px">${x.tags.map(t=>esc(t.note)).join(' ')}</div></div>`).join('')
          : '<p class="mini">No major trading event falls inside these periods.</p>'}
        <p class="mini" style="margin-top:10px">When a month contains one of these, compare it against the same month last year rather than against last month.</p></div>
    </div>

    <div class="card"><h3>Month by month</h3><div class="cap">All loaded periods, normalised per day so short months are not punished</div>
      <div class="tw"><table><thead><tr><th>Month</th><th class="r">Days</th><th class="r">Net sales</th><th class="r">Per day</th>
        <th class="r">Orders</th><th class="r">AOV</th><th class="r">Units/order</th><th class="r">MoM</th><th class="r">Health</th></tr></thead><tbody>
      ${mets.map((x,i)=>{ const prev=i? mets[i-1]:null;
        const mom = prev? ((x.sales/ms[i].days)-(prev.sales/ms[i-1].days))/(prev.sales/ms[i-1].days) : null;
        return `<tr><td><b>${esc(ms[i].label)}</b></td><td class="r mono">${ms[i].days}</td>
          <td class="r mono">${PKR(x.sales)}</td><td class="r mono">${PKR(x.sales/ms[i].days)}</td>
          <td class="r mono">${NUM(x.orders)}</td><td class="r mono">${PKR(x.aov)}</td>
          <td class="r mono">${x.upo.toFixed(2)}</td>
          <td class="r mono ${mom==null?'':dg(mom)}">${mom==null?'—':(mom>0?'+':'')+(mom*100).toFixed(1)+'%'}</td>
          <td class="r mono">${x.health.score}</td></tr>`;}).join('')}
      </tbody></table></div></div>`;
}
</script>


<script>
function pageTrendsCanni(mets){
  if(mets.length<2) return [];
  return cannibalisation(mets[mets.length-1], mets[mets.length-2]);
}

/* =====================================================================
   COACHING ENGINE — gaps, levers, actions, target plan
   ===================================================================== */
const BENCH = {sides:0.30, dess:0.22, drink:0.55, dip:0.35, prem:0.22, single:0.18, feeLeak:0.02, upsizeShare:0.10};

function gapList(c){
  const O=c.orders, g=[];
  const add=(name,note,now,target,value,lever)=>{ if(value>0) g.push({name,note,now,target,value,lever}); };
  /* Targets are one month of coaching away, not a leap to best-in-class.
     A five-point attach gain is a real month's work; a fifteen-point one is a fantasy. */
  const step=(now,bench,inc)=> now>=bench ? now+inc/2 : Math.min(bench, now+inc);
  const aim=(now,bench,inc)=> Math.max(0, step(now,bench,inc)-now);
  add('Dessert attach','Every order without a dessert is the cheapest add-on you own',c.atDess,step(c.atDess,BENCH.dess,0.05),
      aim(c.atDess,BENCH.dess,0.05)*O*c.avgDessPrice,'dess');
  add('Sides attach','Fries, bread and wings ride on a pizza order at no extra delivery cost',c.atSides,step(c.atSides,BENCH.sides,0.05),
      aim(c.atSides,BENCH.sides,0.05)*O*c.avgSidePrice,'sides');
  add('Drinks attach','The highest-margin item on the menu and the easiest yes',c.atDrink,step(c.atDrink,BENCH.drink,0.05),
      aim(c.atDrink,BENCH.drink,0.05)*O*c.avgDrinkPrice,'drink');
  add('Dip attach','Small ticket, near-zero effort, and it lifts the taste score too',c.atDip,step(c.atDip,BENCH.dip,0.05),
      aim(c.atDip,BENCH.dip,0.05)*O*c.avgDipPrice,'dip');
  add('Upsize medium to large','One sentence at order-taking, no extra labour in the kitchen',0.0,BENCH.upsizeShare,c.upsizeValue,'upsize');
  add('Premium crust penetration','Stuffed, New Yorker and Italian crusts carry a real price step',c.premPen,step(c.premPen,BENCH.prem,0.03),
      aim(c.premPen,BENCH.prem,0.03)*c.pizzaQty*Math.max(0,c.premUnit-c.panUnit),'prem');
  add('Cut the dead items','Not new money, but freed prep space, stock and menu attention',c.quads.Dog.length/Math.max(1,c.skuCount),0.05,
      sum(c.quads.Dog.filter(s=>s.qty<=5),s=>s.net)*0.4,'delist');
  if(c.feeLeak>BENCH.feeLeak)
    add('Aggregator fee leakage','Push repeat customers to your own delivery line',c.feeLeak,BENCH.feeLeak,(c.feeLeak-BENCH.feeLeak)*c.sales,'fee');
  return g.sort((a,b)=>b.value-a.value);
}

function actionsFrom(c,gaps,p){
  const A=[];
  const topFlav = c.byFlav[0]? c.byFlav[0].key : 'your best seller';
  const topDip  = c.dips[0]? c.dips[0].key : 'Ranch Dip';
  const g = k => gaps.find(x=>x.lever===k);
  if(g('drink')) A.push({t:'Name a specific drink on every order',why:'Drinks attach is '+PCT(c.atDrink)+'. Asking "anything to drink?" gets a no; naming the bottle gets a yes.',
    pkr:g('drink').value, who:'Order takers', how:'Drinks attach above '+PCT(g('drink').target)+' next month', eff:'Low',
    assume:'Assumes 5 points of attach at the current average drink price of '+PKR(c.avgDrinkPrice)+'.'});
  if(g('dess')) A.push({t:'Add the dessert line to every large-pizza order',why:'Dessert attach is '+PCT(c.atDess)+' while lava cake is already one of your strongest single items.',
    pkr:g('dess').value, who:'Order takers · shift manager', how:'Dessert attach above '+PCT(g('dess').target), eff:'Low',
    assume:'Assumes 5 points of attach at '+PKR(c.avgDessPrice)+' average dessert price.'});
  if(g('upsize')) A.push({t:'Offer the large upgrade on every medium',why:'A medium Pan is '+PKR(c.medUnit)+' and a large is '+PKR(c.lrgUnit)+'. The gap is '+PKR(c.upsizeDelta)+' for the same oven time.',
    pkr:g('upsize').value, who:'Order takers', how:'Large share of pizza units up 2 points', eff:'Low',
    assume:'Assumes one in ten of your '+NUM(c.medQty)+' medium Pan orders moves up.'});
  if(g('prem')) A.push({t:'Push one premium crust as the house recommendation',why:'Premium crust penetration is '+PCT(c.premPen)+'. Each upgraded pizza carries '+PKR(Math.max(0,c.premUnit-c.panUnit))+' more.',
    pkr:g('prem').value, who:'Order takers · marketing', how:'Premium crust share above '+PCT(g('prem').target), eff:'Medium',
    assume:'Assumes 3 points of pizza volume shifts onto a premium crust.'});
  if(g('sides')) A.push({t:'Attach a side to every pizza-only order',why:'Sides attach is '+PCT(c.atSides)+' and the average order carries only '+c.addonPerOrder.toFixed(2)+' non-pizza items.',
    pkr:g('sides').value, who:'Order takers', how:'Sides attach above '+PCT(g('sides').target), eff:'Low',
    assume:'Assumes 5 points of attach at '+PKR(c.avgSidePrice)+' average side price.'});
  if(g('delist')) A.push({t:'Remove the '+NUM(c.quads.Dog.filter(s=>s.qty<=5).length)+' items that barely sold',why:'They occupy stock lines, prep space and menu attention for '+PKR(sum(c.quads.Dog.filter(s=>s.qty<=5),s=>s.net))+' between them.',
    pkr:g('delist').value, who:'Store manager', how:'SKU count down, waste down, no drop in total sales', eff:'Medium',
    assume:'Assumes 40% of that volume moves to a neighbouring item.'});
  if(g('fee')) A.push({t:'Move repeat aggregator customers to your own line',why:'Platform fees took '+PKR(c.aggFees)+' — '+PCT(c.feeLeak,2)+' of sales.',
    pkr:g('fee').value, who:'Store manager · marketing', how:'Aggregator share of orders down 3 points', eff:'High',
    assume:'Assumes fee leakage falls to 2% of sales.'});
  if(p){
    const decl = c.sku.map(s=>{const q=p.sku.find(y=>y.key===s.key); return {key:s.key, d:s.net-(q?q.net:0)}}).sort((a,b)=>a.d-b.d)[0];
    if(decl && decl.d<0) A.push({t:'Find out what happened to '+decl.key,why:'It lost '+PKR(Math.abs(decl.d))+' against last month — the single biggest decline on the menu.',
      pkr:Math.abs(decl.d)*0.5, who:'Store manager', how:'Item back within 20% of its previous level', eff:'Medium',
      assume:'Assumes half the lost volume is recoverable once the cause is found.'});
  }
  return A.sort((a,b)=>b.pkr-a.pkr).slice(0,5);
}

function scriptsFrom(c){
  const dip = c.dips[0]? c.dips[0].key.replace(/ Sauce| Dip/gi,'') : 'Ranch';
  const dess= [...c.sku].filter(s=>CAT_DESS.indexOf(s.cat)>=0).sort((a,b)=>b.qty-a.qty)[0];
  const side= [...c.sku].filter(s=>CAT_SIDES.indexOf(s.cat)>=0).sort((a,b)=>b.qty-a.qty)[0];
  const drink=[...c.sku].filter(s=>CAT_DRINK.indexOf(s.cat)>=0).sort((a,b)=>b.qty-a.qty)[0];
  const top5 = c.byFlav.slice(0,5);
  return top5.map(f=>{
    const bits=[];
    if(dess) bits.push(dess.item+' for '+PKR(dess.unit));
    if(side) bits.push(side.item+' for '+PKR(side.unit));
    if(drink) bits.push('a '+drink.item+' for '+PKR(drink.unit));
    return {item:f.key,
      line:'"'+f.key+' — good choice. Make it a large for '+PKR(c.upsizeDelta)+' more? And a '+dip+' dip with it — most people having the '+f.key+' take one."',
      follow:'"Before I close the order — '+(bits[0]||'a dessert')+'?"'};
  });
}

/* target planner levers */
function targetLevers(c){
  const O=c.orders;
  return [
    {id:'orders', name:'Order growth',    unit:'%', max:20, step:1, def:0,
     note:o=>'+'+o+'% orders · '+NUM(Math.round(O*o/100))+' more orders',
     val:o=> O*(o/100)*c.aov},
    {id:'drink', name:'Drinks attach',    unit:'pp', max:25, step:1, def:0,
     note:o=>'+'+o+' points from '+PCT(c.atDrink), val:o=> O*(o/100)*c.avgDrinkPrice},
    {id:'dess',  name:'Dessert attach',   unit:'pp', max:25, step:1, def:0,
     note:o=>'+'+o+' points from '+PCT(c.atDess),  val:o=> O*(o/100)*c.avgDessPrice},
    {id:'sides', name:'Sides attach',     unit:'pp', max:25, step:1, def:0,
     note:o=>'+'+o+' points from '+PCT(c.atSides), val:o=> O*(o/100)*c.avgSidePrice},
    {id:'dip',   name:'Dip attach',       unit:'pp', max:30, step:1, def:0,
     note:o=>'+'+o+' points from '+PCT(c.atDip),   val:o=> O*(o/100)*c.avgDipPrice},
    {id:'upsize',name:'Medium → large',   unit:'%', max:30, step:1, def:0,
     note:o=>o+'% of '+NUM(c.medQty)+' mediums upsized', val:o=> c.medQty*(o/100)*c.upsizeDelta},
    {id:'prem',  name:'Premium crust',    unit:'pp', max:20, step:1, def:0,
     note:o=>'+'+o+' points from '+PCT(c.premPen),  val:o=> c.pizzaQty*(o/100)*Math.max(0,c.premUnit-c.panUnit)},
    {id:'price', name:'Menu price rise',  unit:'%', max:10, step:1, def:0,
     note:o=>'+'+o+'% across the board', val:o=> c.sales*(o/100)*0.9}
  ];
}

function pageCoach(){
  const m=M(); if(!m){ $('#p-coach').innerHTML=empty(); return; }
  const c=metrics(m), p=metrics(P()), pl=P()?P().label:'';
  const gaps=gapList(c), acts=actionsFrom(c,gaps,p), scripts=scriptsFrom(c);
  const maxGap = gaps.length? gaps[0].value : 1;
  const totalOpp = sum(gaps,g=>g.value);
  const tgt = APP.targets[m.id] || {};
  const target = +tgt.value || 0;
  const gapPkr = Math.max(0, target - c.sales);
  const levers = targetLevers(c);
  const saved  = tgt.levers || {};
  const plan   = APP.plan[m.id] || {};

  const verdict = (()=>{
    if(!p) return `<b>${esc(m.label)}</b> did <b>${PKR(c.sales)}</b> in food sales across <b>${NUM(c.orders)}</b> orders — an average basket of <b>${PKR(c.aov)}</b>. Load the previous month to see direction. The largest single opportunity on the board right now is <b>${esc(gaps[0]?gaps[0].name:'—')}</b>, worth about <b>${PKR(gaps[0]?gaps[0].value:0)}</b> a month.`;
    const d=(c.sales/c.days)-(p.sales/p.days), pc=d/(p.sales/p.days);
    const dO=c.orders-p.orders, dA=c.aov-p.aov;
    return `<b>${esc(m.label)}</b> did <b>${PKR(c.sales)}</b>, ${d>=0?'up':'down'} <b>${(Math.abs(pc)*100).toFixed(1)}%</b> a day against ${esc(pl)}.
      Orders moved ${dO>=0?'up':'down'} <b>${NUM(Math.abs(dO))}</b> and the basket moved ${dA>=0?'up':'down'} <b>${PKR(Math.abs(dA))}</b> to ${PKR(c.aov)}.
      ${Math.abs(dO*p.aov)>Math.abs(dA*c.orders)? 'Traffic drove the change, so reach and visibility are where to work.' : 'The basket drove the change, so upselling and attach are where to work.'}
      The biggest lever available is <b>${esc(gaps[0]?gaps[0].name:'—')}</b> at roughly <b>${PKR(gaps[0]?gaps[0].value:0)}</b> a month.`;
  })();

  $('#p-coach').innerHTML=`
    <div class="eyebrow">${esc(m.label)}</div><h1>Coaching &amp; action plan</h1>
    <p class="lede">Everything on the other pages, turned into things a shift can actually do this week.</p>

    <div class="row" style="margin-bottom:18px">
      <button class="btn red" id="dlPlan">Download action plan (PDF)</button>
      <button class="btn ghost" id="dlOne">Print staff one-pager</button>
    </div>

    <div class="card"><h3>Headline verdict</h3><div class="cap">Auto-written from this month's numbers</div>
      <p class="summary">${verdict}</p></div>

    <div class="board" style="margin-bottom:18px">
      <h2>The gap board</h2>
      <div class="bcap">Every opportunity, ranked by what it is worth in a month · total on the table ${PKR(totalOpp)}</div>
      ${gaps.map(g=>`<div class="gaprow">
        <div class="gl">${esc(g.name)}<small>${g.lever==='upsize'? 'now ~0% offered':'now '+PCT(g.now)} → target ${PCT(g.target)}</small></div>
        <div class="gbar"><i style="width:${(g.value/maxGap*100).toFixed(1)}%"></i></div>
        <div class="gv">${PKR(g.value)}</div></div>`).join('')}
    </div>

    <h2 style="margin:26px 0 4px">Hit your target</h2>
    <p class="lede" style="margin-bottom:14px">Enter what you need to do next month. Then move the sliders until the coverage bar fills.</p>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <div class="pick"><label for="tgtIn">Monthly sales target (PKR)</label>
          <input type="number" id="tgtIn" value="${target||''}" placeholder="e.g. ${Math.round(c.sales*1.1/1000)*1000}" style="width:190px"></div>
        <div class="pick"><label>&nbsp;</label><button class="btn sm" id="tgtSave">Set target</button></div>
        <div class="pick"><label>&nbsp;</label><button class="btn ghost sm" id="tgtSuggest">Suggest +10%</button></div>
      </div>
      <div id="tgtBody"></div>
    </div>

    <h2 style="margin:26px 0 4px">Top five actions</h2>
    <p class="lede" style="margin-bottom:14px">Ranked by money on the table. Each one names an owner and a way to check it next month.</p>
    ${acts.map((a,i)=>`<div class="act">
      <div class="ah"><div class="at">${i+1}. ${esc(a.t)}</div><div class="pk">${PKR(a.pkr)}/mo</div></div>
      <dl>
        <dt>Why</dt><dd>${esc(a.why)}</dd>
        <dt>Owner</dt><dd>${esc(a.who)}</dd>
        <dt>Check</dt><dd>${esc(a.how)}</dd>
        <dt>Effort</dt><dd>${esc(a.eff)}</dd>
        <dt>Basis</dt><dd class="mini">${esc(a.assume)}</dd>
      </dl></div>`).join('')}

    <h2 style="margin:26px 0 4px">Upsell scripts</h2>
    <p class="lede" style="margin-bottom:14px">Built from your own top sellers and your most-ordered dip. Say these word for word.</p>
    ${scripts.map(s=>`<div class="script"><div class="sw">When they order ${esc(s.item)}</div>
      <q>${esc(s.line.replace(/^"|"$/g,''))}</q><br><q style="color:var(--steel)">${esc(s.follow.replace(/^"|"$/g,''))}</q></div>`).join('')}

    <h2 style="margin:26px 0 4px">Four-week plan</h2>
    <div class="grid g4">
      ${weekPlan(acts).map((w,wi)=>`<div class="wk"><h4>${w.title}</h4>
        ${w.items.map((it,ii)=>{const k='w'+wi+'i'+ii;
          return `<label><input type="checkbox" data-pk="${k}" ${plan[k]?'checked':''}><span>${esc(it)}</span></label>`}).join('')}
      </div>`).join('')}
    </div>

    <h2 style="margin:26px 0 4px">Scorecard review</h2>
    ${scorecard(c,p,pl)}`;

  // target planner
  const renderTgt=()=>{
    const t = +$('#tgtIn').value || 0;
    const gp = Math.max(0, t - c.sales);
    const vals = {}; levers.forEach(l=> vals[l.id] = saved[l.id]!=null? saved[l.id] : l.def);
    const body = $('#tgtBody');
    body.innerHTML = `
      ${t? `<div class="grid g4" style="margin-bottom:14px">
        ${tile('T','Target', PKR(t), null)}
        ${tile('T','This month', PKR(c.sales), null)}
        ${tile('T','Gap to close', PKR(gp), null)}
        ${tile('T','Needed per day', PKR(t/c.days), null)}
      </div>` : '<div class="note" style="margin-bottom:14px">Enter a target above and the planner will work out how to reach it from your own numbers.</div>'}
      <div id="levers">${levers.map(l=>`
        <div class="lever" data-l="${l.id}">
          <div><div class="ln">${esc(l.name)}</div><div class="ls" id="n-${l.id}"></div></div>
          <input type="range" min="0" max="${l.max}" step="${l.step}" value="${vals[l.id]}" id="r-${l.id}">
          <div class="lv" id="v-${l.id}"></div>
        </div>`).join('')}</div>
      <div class="cov"><i id="covBar" style="width:0%"></i><span id="covTxt"></span></div>
      <div id="covNote" class="mini"></div>`;

    const recalc=()=>{
      let tot=0;
      levers.forEach(l=>{
        const v=+$('#r-'+l.id).value; vals[l.id]=v;
        const pkr=l.val(v); tot+=pkr;
        $('#n-'+l.id).textContent = v? l.note(v) : 'not used';
        $('#v-'+l.id).textContent = v? PKR(pkr) : '—';
      });
      const cov = gp? clamp(tot/gp,0,1) : (tot?1:0);
      $('#covBar').style.width=(cov*100).toFixed(1)+'%';
      $('#covTxt').textContent = gp? PKR(tot)+' of '+PKR(gp)+' gap covered ('+(cov*100).toFixed(0)+'%)' : PKR(tot)+' of extra sales planned';
      $('#covNote').innerHTML = !gp? 'Set a target to measure coverage.' :
        (tot>=gp ? '<span style="color:var(--moss)"><b>Target covered.</b> Projected '+PKR(c.sales+tot)+' — that is '+PKR((c.sales+tot)/c.days)+' a day. Now assign each lever above to an owner in the four-week plan.</span>'
                 : 'Still short by <b>'+PKR(gp-tot)+'</b>. Add another lever, or accept a target of '+PKR(c.sales+tot)+'.');
      APP.targets[m.id] = {value:+$('#tgtIn').value||0, levers:vals};
      store.set('pulse:targets', APP.targets);
    };
    levers.forEach(l=> $('#r-'+l.id).oninput=recalc);
    recalc();
  };
  $('#tgtSave').onclick=()=>{ renderTgt(); toast('Target set.'); };
  $('#tgtSuggest').onclick=()=>{ $('#tgtIn').value=Math.round(c.sales*1.1/1000)*1000; renderTgt(); };
  $('#tgtIn').onchange=renderTgt;
  renderTgt();

  $$('[data-pk]').forEach(cb=> cb.onchange=()=>{
    const st=APP.plan[m.id]||{}; st[cb.dataset.pk]=cb.checked; APP.plan[m.id]=st; store.set('pulse:plan',APP.plan);
  });
  $('#dlPlan').onclick=()=>exportPlanPDF(c,p,gaps,acts,scripts);
  $('#dlOne').onclick=()=>exportOnePagerPDF(c,acts,scripts);
}

function weekPlan(acts){
  const a = n => acts[n]? acts[n].t : null;
  return [
    {title:'Week 1 · Set up', items:[
      'Brief the team on this month\u2019s numbers and the one target',
      a(0)? 'Write the script for: '+a(0) : 'Write the upsell script for the top seller',
      'Print the one-pager and put it at the order station',
      'Update the menu board with the promote list']},
    {title:'Week 2 · Run it', items:[
      'Listen to five order calls and correct the script live',
      a(1)? 'Start: '+a(1) : 'Start the second action',
      'Check dip and drink stock so nobody skips the offer',
      'Post the running attach rate where the shift can see it']},
    {title:'Week 3 · Check', items:[
      'Pull a mid-month product mix and compare attach rates',
      'Name the two people doing it best and say so publicly',
      a(2)? 'Fix what is blocking: '+a(2) : 'Fix whatever is blocking the third action',
      'Drop any action that clearly is not moving']},
    {title:'Week 4 · Measure', items:[
      'Export the full month product mix from Pulse',
      'Load it here and compare against target',
      'Grade each action hit or missed on the scorecard',

}
function scorecard(c,p,pl){
  if(!p) return '<div class="note">Load the previous month and this grades itself: each target from last month against what actually happened.</div>';
  const rows=[
    ['Net food sales', p.sales, c.sales, PKR],
    ['Orders', p.orders, c.orders, NUM],
    ['Average order value', p.aov, c.aov, PKR],
    ['Units per order', p.upo, c.upo, x=>x.toFixed(2)],
    ['Sides attach', p.atSides, c.atSides, PCT],
    ['Drinks attach', p.atDrink, c.atDrink, PCT],
    ['Dessert attach', p.atDess, c.atDess, PCT],
    ['Dip attach', p.atDip, c.atDip, PCT],
    ['Premium crust', p.premPen, c.premPen, PCT],
    ['Menu health score', p.health.score, c.health.score, NUM]
  ];
  return `<div class="card"><div class="cap">Last month against this month, so you can see which coaching actually landed</div>
    <div class="tw"><table><thead><tr><th>Measure</th><th class="r">${esc(pl)}</th><th class="r">Now</th><th class="r">Change</th><th>Result</th></tr></thead><tbody>
    ${rows.map(r=>{const d=(r[2]-r[1])/(r[1]||1);
      return `<tr><td>${r[0]}</td><td class="r mono">${r[3](r[1])}</td><td class="r mono">${r[3](r[2])}</td>
      <td class="r mono ${dg(d)}">${(d>0?'+':'')+(d*100).toFixed(1)}%</td>
      <td>${d>0.01?'<span class="tag t-star">hit</span>':(d<-0.01?'<span class="tag t-dog">missed</span>':'<span class="tag t-plow">flat</span>')}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
}

  A(41,'Pricing','Average price, largest category',PKR(catN(big).net/Math.max(1,catN(big).qty)),null,'pizza','');

  A(44,'Pricing','Upsize opportunity',PKR(c.upsizeValue),null,'pizza','10% of mediums moved to large');
  A(45,'Pricing','Premium crust uplift earned',PKR(c.premUplift),null,'pizza','Against a Pan baseline');

  A(46,'Basket','Items per order',c.upo.toFixed(2),R('upo'),'overview','');

function pageData(){

  const prev = p? new Map(p.sku.map(s=>[s.key,s])) : new Map();
  const data = c.sku.map(s=>{const q=prev.get(s.key); return {...s, pQty:q?q.qty:null, pNet:q?q.net:null,
      dQty:q?s.qty-q.qty:null, dNet:q?s.net-q.net:null, dMix:q?s.netShare-(q.net/p.sales):null};});
  const st = APP.sort.data || {k:'net',dir:-1};
  data.sort((a,b)=>{const x=a[st.k],y=b[st.k]; if(typeof x==='string') return st.dir*x.localeCompare(y); return st.dir*((x||0)-(y||0));});
  const cols=[['key','Item',''],['cat','Category',''],['qty','Qty','r'],['net','Net sales','r'],['unit','Unit price','r'],
    ['netShare','Sales mix','r'],['orders','Orders','r'],['quad','Type',''],['dQty','Δ qty','r'],['dNet','Δ net','r'],['dMix','Δ mix','r']];
  const fmt={qty:NUM,net:PKR,unit:PKR,netShare:PCT,orders:NUM,dQty:NUM,dNet:PKR,dMix:x=>x==null?'—':PP(x)};

  $('#p-data').innerHTML=`
    <div class="eyebrow">${esc(m.label)} · ${NUM(data.length)} items</div><h1>Data table</h1>
    <p class="lede">Every parsed line, sortable, with the change against ${pl? '<b>'+esc(pl)+'</b>':'nothing (load another month)'}.</p>

      ${m.warnings.length? '<span class="tag t-dog">'+m.warnings.length+' parse warnings</span>':'<span class="tag t-star">parsed clean</span>'}
    </div>
    ${m.warnings.length? '<div class="note" style="margin-bottom:12px">'+m.warnings.slice(0,8).map(esc).join('<br>')+'</div>':''}
    <div class="tw" id="tw"><table><thead><tr>${cols.map(x=>`<th class="${x[2]}" data-k="${x[0]}">${x[1]}${st.k===x[0]?(st.dir<0?' ▼':' ▲'):''}</th>`).join('')}</tr></thead>
      <tbody id="tb">${data.map(r=>rowHtml(r,cols,fmt)).join('')}</tbody></table></div>`;

  $$('#p-data th').forEach(th=> th.onclick=()=>{
    const k=th.dataset.k; APP.sort.data = {k, dir: (st.k===k? -st.dir : -1)}; pageData();
  });
  $('#q').oninput=e=>{
    const t=e.target.value.toLowerCase();
    $('#tb').innerHTML = data.filter(r=>r.key.toLowerCase().indexOf(t)>=0||r.cat.toLowerCase().indexOf(t)>=0).map(r=>rowHtml(r,cols,fmt)).join('');
  };
  $('#csv').onclick=()=>exportCSV();
}
function rowHtml(r,cols,fmt){
  return '<tr>'+cols.map(x=>{
    let v=r[x[0]];
    if(x[0]==='quad') return '<td><span class="tag '+qcls(v)+'">'+v+'</span></td>';
    if(v==null) return '<td class="'+(x[2]?'r mono':'')+'">—</td>';
    const f=fmt[x[0]]; const t=f?f(v):esc(v);
    const cls = (x[0].charAt(0)==='d' && x[0].length<6) ? ' '+dg(v) : '';
    return '<td class="'+(x[2]?'r mono':'')+cls+'">'+t+'</td>';
  }).join('')+'</tr>';
}

      <button class="btn red" id="wipe">Delete everything</button></div>`}`;

  $$('[data-cost]').forEach(i=> i.onchange=async()=>{

  });
  $$('[data-tgt]').forEach(i=> i.onchange=async()=>{

  if($('#wipe')) $('#wipe').onclick=async()=>{

/* --- jsPDF helpers --- */
function newDoc(){
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:'pt',format:'a4'});
  d._y=0; d.W=d.internal.pageSize.getWidth(); d.H=d.internal.pageSize.getHeight(); d.MX=44;
  return d;
}
function head(d,title,sub){
  d.setFillColor(21,26,33); d.rect(0,0,d.W,84,'F');
  d.setFillColor(200,16,46); d.rect(0,84,d.W,4,'F');
  d.setTextColor(255); d.setFont('helvetica','bold'); d.setFontSize(20); d.text(title,d.MX,44);
  d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor(190,198,208); d.text(sub,d.MX,64);
  d.setTextColor(21,26,33); d._y=118;
}
function brk(d,need){ if(d._y+(need||24)>d.H-48){ d.addPage(); d._y=56; } }
function h2(d,t){ brk(d,40); d.setFont('helvetica','bold'); d.setFontSize(13); d.setTextColor(21,26,33); d.text(t.toUpperCase(),d.MX,d._y); d._y+=6;
  d.setDrawColor(200,16,46); d.setLineWidth(1.4); d.line(d.MX,d._y,d.MX+34,d._y); d._y+=16; }
function para(d,t,size){ d.setFont('helvetica','normal'); d.setFontSize(size||10); d.setTextColor(50,58,68);
  const lines=d.splitTextToSize(t,d.W-d.MX*2); lines.forEach(l=>{ brk(d,15); d.text(l,d.MX,d._y); d._y+=13.6; }); d._y+=6; }
function kv(d,rows,cols){
  cols=cols||3; const w=(d.W-d.MX*2)/cols;
  for(let i=0;i<rows.length;i+=cols){
    brk(d,52);
    const y=d._y;
    for(let j=0;j<cols;j++){
      const r=rows[i+j]; if(!r) continue; const x=d.MX+j*w;
      d.setDrawColor(215,221,228); d.setLineWidth(.7); d.rect(x,y,w-8,46);
      d.setFont('helvetica','normal'); d.setFontSize(7.4); d.setTextColor(110,120,132); d.text(String(r[0]).toUpperCase(),x+8,y+15);
      d.setFont('helvetica','bold'); d.setFontSize(13); d.setTextColor(21,26,33); d.text(String(r[1]),x+8,y+33);
      if(r[2]){ d.setFont('helvetica','normal'); d.setFontSize(7.6); d.setTextColor(r[3]||120,r[3]!=null?120:126,r[3]!=null?100:136); d.text(String(r[2]),x+8,y+42); }
    }
    d._y=y+56;
  }
}
function table(d,cols,rows,widths){
  const W=d.W-d.MX*2; const ws=widths.map(x=>x*W);
  brk(d,40);
  d.setFillColor(21,26,33); d.rect(d.MX,d._y,W,20,'F');
  d.setFont('helvetica','bold'); d.setFontSize(8); d.setTextColor(255);
  let x=d.MX; cols.forEach((c,i)=>{ d.text(String(c).toUpperCase(), i? x+ws[i]-5 : x+6, d._y+13.5, {align:i?'right':'left'}); x+=ws[i]; });
  d._y+=20;
  d.setFont('helvetica','normal'); d.setFontSize(8.6); d.setTextColor(40,48,58);
  rows.forEach((r,ri)=>{
    brk(d,18);
    if(ri%2){ d.setFillColor(246,248,250); d.rect(d.MX,d._y,W,16,'F'); }
    let x=d.MX;
    r.forEach((c,i)=>{
      let t=String(c);
      const maxw=ws[i]-12;
      while(d.getTextWidth(t)>maxw && t.length>4) t=t.slice(0,-2);
      d.text(t, i? x+ws[i]-5 : x+6, d._y+11.4, {align:i?'right':'left'}); x+=ws[i];
    });
    d._y+=16;
  });
  d._y+=12;
}
function foot(d,label){
  const n=d.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ d.setPage(i); d.setFont('helvetica','normal'); d.setFontSize(7.4); d.setTextColor(140,150,162);
    d.text(label,d.MX,d.H-24); d.text('Page '+i+' of '+n,d.W-d.MX,d.H-24,{align:'right'}); }
}

    d.setFontSize(12); d.setTextColor(46,125,79); d.text(PKR(a.pkr)+'/mo', d.W-d.MX, y+16, {align:'right'});
    d._y=y+30;
    const row=(k,v)=>{ d.setFont('helvetica','bold'); d.setFontSize(7.4); d.setTextColor(110,120,132); d.text(k.toUpperCase(),d.MX+12,d._y);
      d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(40,48,58);
      const ls=d.splitTextToSize(v,W-84); ls.forEach((l,li)=>{ d.text(l,d.MX+66,d._y+li*11.5); });
      d._y += Math.max(13, ls.length*11.5+2); };
    row('Why',a.why); row('Owner',a.who); row('Check',a.how); row('Effort',a.eff); row('Basis',a.assume);
    d._y+=12;
  });

  if(tgt){
    h2(d,'How to hit '+PKR(tgt));
    const lv=targetLevers(c), saved=(APP.targets[m.id]||{}).levers||{};
    const used=lv.filter(l=>(saved[l.id]||0)>0);
    para(d,'Gap to close: '+PKR(Math.max(0,tgt-c.sales))+'. That is '+PKR(tgt/c.days)+' a day against '+PKR(c.salesPerDay)+' today.');
    if(used.length){
      table(d,['Lever','Move','Adds'], used.map(l=>[l.name, (saved[l.id])+l.unit, PKR(l.val(saved[l.id]))]),[.46,.24,.30]);
      const tot=sum(used,l=>l.val(saved[l.id]));
      para(d,'Planned levers add '+PKR(tot)+', which covers '+
        Math.round(tot/Math.max(1,tgt-c.sales)*100)+'% of the gap. Projected close: '+PKR(c.sales+tot)+'.');
    } else para(d,'No levers selected yet. Open the coaching page and move the sliders to build the plan.');
  }

  h2(d,'Upsell scripts');
  scripts.forEach(s=>{ brk(d,54);
    d.setFont('helvetica','bold'); d.setFontSize(8); d.setTextColor(110,120,132); d.text('WHEN THEY ORDER '+s.item.toUpperCase(),d.MX,d._y); d._y+=13;
    d.setFont('helvetica','italic'); d.setFontSize(10); d.setTextColor(21,26,33);
    d.splitTextToSize(s.line,d.W-d.MX*2).forEach(l=>{ brk(d,14); d.text(l,d.MX,d._y); d._y+=13; });
    d.setTextColor(90,102,117);
    d.splitTextToSize(s.follow,d.W-d.MX*2).forEach(l=>{ brk(d,14); d.text(l,d.MX,d._y); d._y+=13; });
    d._y+=8;
  });

  h2(d,'Four-week plan');
  weekPlan(acts).forEach(w=>{
    brk(d,60);
    d.setFont('helvetica','bold'); d.setFontSize(10); d.setTextColor(200,16,46); d.text(w.title,d.MX,d._y); d._y+=15;
    d.setFont('helvetica','normal'); d.setFontSize(9.4); d.setTextColor(40,48,58);
    w.items.forEach(it=>{ brk(d,15); d.setDrawColor(150,160,172); d.rect(d.MX+2,d._y-8,8,8,'S');
      d.splitTextToSize(it,d.W-d.MX*2-22).forEach((l,li)=>{ if(li){brk(d,13); d._y+=12;} d.text(l,d.MX+18,d._y); });
      d._y+=15; });
    d._y+=6;
  });
  foot(d,'Action plan  ·  '+m.label+'  ·  '+(m.store||''));
  d.save('action-plan-'+m.id+'.pdf'); toast('Action plan downloaded.');
}

function exportOnePagerPDF(c,acts,scripts){
  const m=M(); const d=newDoc();
  const tgt=(APP.targets[m.id]||{}).value||0;
  head(d,'This month at the order station', m.label+'  ·  '+(m.store||'')+'  ·  keep this by the phone');
  h2(d,'Push these three');
  const push=[...c.sku].filter(s=>s.quad==='Star').sort((a,b)=>b.margin-a.margin).slice(0,3);
  (push.length?push:c.topRev.slice(0,3)).forEach((s,i)=>{
    brk(d,30); d.setFont('helvetica','bold'); d.setFontSize(17); d.setTextColor(21,26,33);
    d.text((i+1)+'.  '+s.item+(s.size?' '+s.size:''),d.MX,d._y);
    d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(110,120,132);
    d.text(PKR(s.unit),d.W-d.MX,d._y,{align:'right'}); d._y+=26;
  });
  h2(d,'Say these three lines');
  scripts.slice(0,3).forEach(s=>{ brk(d,40);
    d.setFont('helvetica','italic'); d.setFontSize(12.5); d.setTextColor(21,26,33);
    d.splitTextToSize(s.line,d.W-d.MX*2).forEach(l=>{ brk(d,18); d.text(l,d.MX,d._y); d._y+=17; }); d._y+=10; });
  h2(d,'This month we are chasing');
  const gl=gapList(c), gt=k=>{const x=gl.find(y=>y.lever===k); return x? 'target '+PCT(x.target):'hold';};
  const rows=[['Drinks attach',PCT(c.atDrink),gt('drink')],
              ['Dessert attach',PCT(c.atDess),gt('dess')],
              ['Sides attach',PCT(c.atSides),gt('sides')],
              ['Large share',PCT((c.bySize.find(s=>s.key==='12"-Large')||{share:0}).share),'up 2 points'],
              ['Premium crust',PCT(c.premPen),gt('prem')],
              ['Sales target',tgt?PKR(tgt):'—',tgt?PKR(tgt/c.days)+' a day':'set one']];
  kv(d,rows,2);
  d.setFont('helvetica','bold'); d.setFontSize(11); d.setTextColor(200,16,46);
  brk(d,30); d.text('Last month we did '+PKR(c.sales)+' from '+NUM(c.orders)+' orders. Every basket was '+PKR(c.aov)+'.',d.MX,d._y);
  foot(d,'Order station one-pager  ·  '+m.label);
  d.save('one-pager-'+m.id+'.pdf'); toast('One-pager downloaded.');
}

/* =====================================================================
   RENDER + INIT
   ===================================================================== */
function render(){
  refreshStrip();
  try{
    ({upload:pageUpload,overview:pageOverview,movers:pageMovers,pizza:pagePizza,menu:pageMenu,
      trends:pageTrends,coach:pageCoach,kpis:pageKpis,data:pageData,setup:pageSetup})[PAGE]();
  }catch(e){
    console.error(e);
    $('#p-'+PAGE).innerHTML='<div class="warn" style="margin-top:24px"><b>Something went wrong drawing this page.</b><br>'+esc(e.message)+
      '<br><br>Try removing the month in Files and loading the PDF again.</div>';
  }
}
$('#mSel').onchange=e=>{ APP.cur=e.target.value; APP.cmp=prevMonthId(); render(); };
$('#cSel').onchange=e=>{ APP.cmp=e.target.value; render(); };
$$('#basis button').forEach(b=> b.onclick=()=>{ APP.basis=b.dataset.b; render(); });
$('#burger').onclick=()=>{ $('.rail').classList.toggle('open'); $('#scrim').classList.toggle('open'); };
$('#scrim').onclick=closeRail;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeRail(); });
window.go=go;
boot();
</script>
