<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse PM Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#151A21; --slate:#232B35; --steel:#5A6675; --mute:#8A94A2;
  --line:#D7DDE4; --hair:#E7EBF0; --surface:#EEF1F5; --paper:#FFFFFF;
  --flame:#C8102E; --navy:#0B5AA8; --tape:#F2C230; --moss:#2E7D4F;
  --disp:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans", -apple-system, Segoe UI, Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1{font-size:30px;line-height:1.05}
h2{font-size:21px;line-height:1.1}
h3{font-size:16px;line-height:1.15}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--navy)}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{width:196px;flex:0 0 196px;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:18px 16px 14px;border-bottom:1px solid #2A323C}
.brand .mk{font-family:var(--disp);font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand .mk b{color:var(--flame)}
.brand .sub{font-family:var(--mono);font-size:10px;color:#7C8794;letter-spacing:.12em;margin-top:5px;text-transform:uppercase}
.nav{padding:8px 0;flex:1;overflow-y:auto}
.nav button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;color:#A7B1BE;
  font-family:var(--disp);font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:9px 16px;text-align:left;border-left:3px solid transparent}
.nav button:hover{color:#fff;background:#1D242C}
.nav button.on{color:#fff;background:#1D242C;border-left-color:var(--flame)}
.nav .idx{font-family:var(--mono);font-size:10px;color:#5C6672;width:14px}
.nav button.on .idx{color:var(--flame)}
.railfoot{padding:12px 16px;border-top:1px solid #2A323C;font-family:var(--mono);font-size:10px;color:#5C6672;line-height:1.6}
.main{flex:1;min-width:0;padding:0 26px 60px}

/* ---------- month strip ---------- */
.strip{position:sticky;top:0;z-index:40;background:var(--surface);padding:14px 0 12px;border-bottom:1px solid var(--line);
  display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.pick label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:4px}
select,input[type=text],input[type=number],input[type=date]{font-family:var(--mono);font-size:13px;padding:7px 9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--r)}
select{min-width:150px}
.stripmeta{margin-left:auto;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--steel);line-height:1.6}

/* ---------- generic ---------- */
.page{display:none;animation:fade .18s ease-out}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--flame);margin-bottom:6px}
.lede{color:var(--steel);max-width:62ch;margin:6px 0 22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.card > h3{margin-bottom:2px}
.card .cap{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1180px){.g4,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}
  .main{padding:0 14px 70px}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:120;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .rail.open{transform:none}
  .topbar{display:flex !important}
  .strip{top:52px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,14,19,.55);z-index:110}
  .scrim.open{display:block}
  h1{font-size:24px}
  .gaprow{grid-template-columns:1fr;gap:5px}
  .gaprow .gv{text-align:left}
  .lever{grid-template-columns:1fr;gap:5px}
  .lever .lv{text-align:left}
  .act dl{grid-template-columns:1fr;gap:0}
  .act dt{padding-top:7px}
  table{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
.topbar{display:none;position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;align-items:center;gap:12px;
  padding:9px 14px;margin:0 -14px 0;height:52px}
.topbar .mk{font-family:var(--disp);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.topbar .mk b{color:var(--flame)}
.topbar .now{margin-left:auto;font-family:var(--mono);font-size:10px;color:#8A94A2;text-transform:uppercase;letter-spacing:.08em}
.burger{background:none;border:1px solid #39424D;border-radius:3px;width:34px;height:30px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:3.5px;padding:0}
.burger i{display:block;width:15px;height:1.8px;background:#fff}

/* ---------- kpi tile ---------- */
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 12px;position:relative}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);min-height:24px}
.kpi .v{font-family:var(--disp);font-size:27px;font-weight:700;line-height:1.05;margin:5px 0 2px}
.kpi .d{font-family:var(--mono);font-size:11px;display:flex;gap:6px;align-items:baseline;border-top:1px dotted var(--line);padding-top:6px;margin-top:7px}
.up{color:var(--moss)} .down{color:var(--flame)} .flat{color:var(--mute)}
.kpi .prev{color:var(--mute);font-size:10px}
.kpi .n{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:9px;color:#C3CAD3}

/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);max-height:560px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--ink);color:#fff;font-family:var(--disp);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;text-align:left;padding:8px 10px;white-space:nowrap;z-index:2;cursor:pointer;font-weight:600}
th.r,td.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
tbody tr:hover{background:#F6F8FA}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid}
.t-star{color:#8A6A00;border-color:#E5CE87;background:#FDF6E0}
.t-plow{color:#0B5AA8;border-color:#B4CFE9;background:#EAF2FA}
.t-puz{color:#6B4E9E;border-color:#CFC1E6;background:#F3EFFA}
.t-dog{color:var(--flame);border-color:#EFC0C8;background:#FCEDEF}

/* ---------- buttons ---------- */
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--r);padding:9px 15px;
  font-family:var(--disp);font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.btn:hover{background:var(--slate)}
.btn.red{background:var(--flame);border-color:var(--flame)}
.btn.red:hover{background:#A80D26}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--paper);border-color:var(--steel)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- dropzone ---------- */
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--paper);padding:44px 20px;text-align:center;transition:border-color .15s,background .15s}
.drop.hot{border-color:var(--flame);background:#FFF7F8}
.drop .big{font-family:var(--disp);font-size:22px;text-transform:uppercase}
.drop .sm{color:var(--steel);font-size:12.5px;margin-top:6px}

/* ---------- gap board (signature) ---------- */
.board{background:var(--ink);border-radius:var(--r);padding:22px 24px 24px;color:#fff;position:relative;overflow:hidden}
.board h2{color:#fff}
.board .bcap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7C8794;margin-bottom:18px}
.tapebox{background:var(--tape);color:#141A21;display:inline-block;padding:8px 16px 6px;transform:rotate(-1.1deg);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tapebox .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.tapebox .tv{font-family:var(--disp);font-size:36px;font-weight:700;line-height:1}
.gaprow{display:grid;grid-template-columns:200px 1fr 118px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #2C343E}
.gaprow:last-child{border-bottom:0}
.gaprow .gl{font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.gaprow .gl small{display:block;font-family:var(--mono);font-size:9.5px;color:#7C8794;letter-spacing:.06em;text-transform:none}
.gbar{height:16px;background:#2C343E;border-radius:2px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--tape)}
.gaprow .gv{font-family:var(--mono);font-size:13px;text-align:right;color:var(--tape)}

/* ---------- action cards ---------- */
.act{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--flame);border-radius:var(--r);padding:15px 17px;margin-bottom:12px}
.act .ah{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:8px}
.act .at{font-family:var(--disp);font-size:17px;text-transform:uppercase;line-height:1.1}
.act .pk{font-family:var(--mono);font-size:15px;color:var(--moss);white-space:nowrap;font-weight:600}
.act dl{display:grid;grid-template-columns:78px 1fr;gap:3px 12px;margin:0;font-size:12.5px}
.act dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding-top:3px}
.act dd{margin:0;color:var(--slate)}

.script{background:#FBFCFD;border:1px solid var(--line);border-left:3px solid var(--navy);padding:11px 14px;margin-bottom:9px;border-radius:var(--r)}
.script .sw{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:4px}
.script q{font-size:14px;font-style:italic;color:var(--ink)}

.wk{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:13px 15px}
.wk h4{font-family:var(--disp);font-size:14px;text-transform:uppercase;color:var(--flame);margin-bottom:8px}
.wk label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:4px 0;cursor:pointer;color:var(--slate)}
.wk input{margin-top:3px;accent-color:var(--flame)}

.lever{display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.lever:last-child{border-bottom:0}
.lever .ln{font-size:13px;font-weight:500}
.lever .ls{font-family:var(--mono);font-size:10.5px;color:var(--steel)}
.lever input[type=range]{width:100%;accent-color:var(--flame)}
.lever .lv{font-family:var(--mono);font-size:13px;text-align:right;color:var(--moss);font-weight:600}
.cov{height:22px;background:var(--hair);border-radius:2px;overflow:hidden;position:relative;margin:10px 0 4px}
.cov i{display:block;height:100%;background:var(--moss);transition:width .2s}
.cov span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}

.note{background:#FFFBEB;border:1px solid #F0DFA8;border-radius:var(--r);padding:11px 14px;font-size:12.5px;color:#6B5714}
.warn{background:#FCEDEF;border:1px solid #EFC0C8;border-radius:var(--r);padding:11px 14px;font-size:12.5px;color:#7E1223}
.ok{background:#EDF6F0;border:1px solid #B9DCC7;border-radius:var(--r);padding:11px 14px;font-size:12.5px;color:#1D5334}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.hc{border-radius:var(--r);padding:11px 12px;border:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;gap:2px}
.hc .hk{font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.hc .hv{font-family:var(--mono);font-size:16px;font-weight:600}
.hc .hn{font-family:var(--mono);font-size:10px;opacity:.75}
.summary{font-size:15px;line-height:1.65;color:var(--slate)}
.summary b{color:var(--ink)}
.mini{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.empty{text-align:center;padding:52px 20px;color:var(--steel)}
.empty .big{font-family:var(--disp);font-size:20px;text-transform:uppercase;color:var(--ink)}
.qbadge{display:inline-flex;gap:5px;align-items:center;font-family:var(--mono);font-size:10px}
hr.h{border:0;border-top:1px solid var(--hair);margin:16px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--steel);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.sw{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sw button{background:var(--paper);border:0;border-right:1px solid var(--line);padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--steel)}
.sw button:last-child{border-right:0}
.sw button.on{background:var(--ink);color:#fff}
#toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:99;max-width:340px}
#toast.on{opacity:1;transform:none}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
svg text{font-family:var(--mono)}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mk">Pulse<b>·</b>PM</div>
      <div class="sub">Product Mix Analyzer</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      Files stay in this browser.<br>Nothing is uploaded.
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="Open menu"><i></i><i></i><i></i></button>
      <span class="mk">Pulse<b>·</b>PM</span>
      <span class="now" id="nowPage">Files</span>
    </div>
    <div class="strip" id="strip" hidden>
      <div class="pick">
        <label for="mSel">Month</label>
        <select id="mSel"></select>
      </div>
      <div class="pick">
        <label for="cSel">Compare against</label>
        <select id="cSel"></select>
      </div>
      <div class="pick">
        <label for="basis">Basis</label>
        <div class="sw" id="basis">
          <button data-b="raw" class="on">Raw total</button>
          <button data-b="day">Per day</button>
        </div>
      </div>
      <div class="stripmeta" id="stripMeta"></div>
    </div>

    <section class="page on" id="p-upload"></section>
    <section class="page" id="p-overview"></section>
    <section class="page" id="p-movers"></section>
    <section class="page" id="p-pizza"></section>
    <section class="page" id="p-menu"></section>
    <section class="page" id="p-trends"></section>
    <section class="page" id="p-coach"></section>
    <section class="page" id="p-kpis"></section>
    <section class="page" id="p-data"></section>
    <section class="page" id="p-setup"></section>
  </main>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* =====================================================================
   PULSE PM ANALYZER  —  core: storage, parsing, model
   ===================================================================== */
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- tiny helpers ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc= (t)=> String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum= (a,f)=> a.reduce((s,x)=>s+(f?f(x):x)||0,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const PKR = n => 'PKR ' + Math.round(n||0).toLocaleString('en-US');
const PKR2= n => 'PKR ' + (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const K   = n => { n=n||0; if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+'M'; if(Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'k'; return Math.round(n).toString(); };
const PKRk= n => 'PKR '+K(n);
const NUM = n => Math.round(n||0).toLocaleString('en-US');
const PCT = (n,d)=> (n==null||isNaN(n)?'—':(n*100).toFixed(d==null?1:d)+'%');
const PP  = n => (n>=0?'+':'')+(n*100).toFixed(1)+'pp';
const dg  = n => n>0?'up':(n<0?'down':'flat');
const arrow=n=> n>0?'▲':(n<0?'▼':'—');
function toast(m,ms){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||2600);}

/* ---------- persistence (window.storage w/ memory fallback) ---------- */
const MEM = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); return r? JSON.parse(r.value): (MEM[k]??null); } }catch(e){}
    return MEM[k] ?? null;
  },
  async set(k,v){
    MEM[k]=v;
    try{ if(window.storage) await window.storage.set(k, JSON.stringify(v), false); }catch(e){}
    return v;
  },
  async del(k){ delete MEM[k]; try{ if(window.storage) await window.storage.delete(k,false);}catch(e){} }
};

/* ---------- domain constants ---------- */
const NONFOOD   = ['Delivery'];
const PIZZACATS = ['Pizza','LddPizza'];
const CAT_SIDES = ['Sides','Bread'];
const CAT_DRINK = ['Drinks'];
const CAT_DESS  = ['Desserts'];
const CAT_DIP   = ['Sauce'];
const PREMIUM   = ['Stuffed Cheese','Stuffed Kebab','New Yorker','Cheese Burst','Double Melt','Italian Crust'];
const CRUSTS    = ['Pan','Classic Hand Tossed','Crunchy Thin','Italian Crust','Stuffed Cheese','Stuffed Kebab','New Yorker','Cheese Burst','Double Melt'];
const SIZE_ORDER= ['6"-Small','10"-Medium','12"-Large','16" Extra Large'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function normCrust(s){
  if(!s) return '';
  let t = s.replace(/\s+/g,' ').trim();
  const map = {'classic hand tossed':'Classic Hand Tossed','hand tossed':'Classic Hand Tossed','crunchy thin':'Crunchy Thin',
    'italian crust':'Italian Crust','stuffed cheese':'Stuffed Cheese','stuffed kebab':'Stuffed Kebab','new yorker':'New Yorker',
    'cheese burst':'Cheese Burst','double melt':'Double Melt','pan':'Pan'};
  const k = t.toLowerCase();
  if(map[k]) return map[k];
  for(const m in map){ if(k.indexOf(m)>=0) return map[m]; }
  return t;
}
function normSize(s){
  if(!s) return '';
  let t = s.replace(/\s+/g,' ').trim();
  if(/^6"/.test(t)) return '6"-Small';
  if(/^10"/.test(t)) return '10"-Medium';
  if(/^12"/.test(t)) return '12"-Large';
  if(/^16"/.test(t)) return '16" Extra Large';
  if(/^large$/i.test(t)) return '12"-Large';
  if(/^medium$/i.test(t)) return '10"-Medium';
  if(/^small$/i.test(t)) return '6"-Small';
  return t;
}
const isPizza = r => PIZZACATS.indexOf(r.cat)>=0;
const isFood  = r => NONFOOD.indexOf(r.cat)<0;

/* =====================================================================
   PDF PARSER  — coordinate-aware reconstruction of Pulse v3.9 layout
   ===================================================================== */
const COLNAMES = ['cat','item','size','crust','net','qty','pmix','smix','orders','pop'];
const HEADS = ['Menu Category','Menu Item','Size','Flavor/Crust','Net Amount','Quantity','Product Mix','Sales Mix','Orders','Percent of Orders'];
const JUNK = [/^Product Mix$/i,/^Begin Date:?$/i,/^End Date:?$/i,/^Team Member:?/i,/Domino'?s Pulse/i,/^MKT\d+/i,/^Page \d+$/i,/^\d{1,2}\/\d{1,2}\/\d{4}$/,/^©/];

function toNum(s){ if(s==null) return null; const t=String(s).replace(/PKR|,|\s/g,'').replace(/%/g,''); if(t===''||isNaN(Number(t))) return null; return Number(t); }

async function parsePDF(file, onProgress){
  const buf  = await file.arrayBuffer();
  const doc  = await pdfjsLib.getDocument({data:buf}).promise;
  const meta = {store:'', member:'', begin:'', end:''};
  const warnings=[]; const rows=[];
  let spans=null, currentCat='', rec=null;

  const push = ()=>{
    if(!rec) return;
    const net = toNum(rec.net), qty = toNum(rec.qty);
    const name=(rec.item||'').replace(/\s+/g,' ').trim();
    if(net!=null && qty!=null && qty>0 && name){
      const unit = net/qty;
      rows.push({
        cat: rec.cat || currentCat, item: name,
        size: normSize(rec.size), crust: normCrust(rec.crust),
        net, qty, unit,
        pmix:(toNum(rec.pmix)||0)/100, smix:(toNum(rec.smix)||0)/100,
        orders: toNum(rec.orders)||0, pop:(toNum(rec.pop)||0)/100
      });
      if(unit < 5 || unit > 25000) warnings.push('Odd unit price on "'+name+'" — '+PKR2(unit)+' each. Worth checking.');
    }
    rec=null;
  };

  for(let p=1;p<=doc.numPages;p++){
    if(onProgress) onProgress(p, doc.numPages);
    const page = await doc.getPage(p);
    const tc   = await page.getTextContent();
    let items = tc.items.filter(i=>i.str && i.str.trim()!=='')
      .map(i=>({s:i.str, x:i.transform[4], w:i.width||0, y:i.transform[5]}));
    if(!items.length) continue;

    items.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
    const lines=[]; let cur=[];
    for(const it of items){
      if(!cur.length || Math.abs(cur[0].y - it.y) <= 3.2) cur.push(it);
      else { lines.push(cur.sort((a,b)=>a.x-b.x)); cur=[it]; }
    }
    if(cur.length) lines.push(cur.sort((a,b)=>a.x-b.x));

    for(const ln of lines){
      const joined = ln.map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim();

      /* --- header line: learn the ten column spans --- */
      if(joined.indexOf('Menu Category')>=0 && joined.indexOf('Net Amount')>=0){
        const sp = headerSpans(ln);
        if(sp) spans = sp;
        continue;
      }
      /* --- metadata --- */
      const mm = joined.match(/Team Member:\s*(.+?)\s+(\d{4,6}\s+\S.*)$/);
      if(mm){ meta.member=mm[1].trim(); meta.store=mm[2].trim(); }
      const dd = joined.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
      if(dd && /Begin Date/.test(joined)) meta.begin=dd[1];
      else if(dd && /End Date/.test(joined)) meta.end=dd[1];
      else if(dd && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(joined)){ if(!meta.begin) meta.begin=dd[1]; else if(!meta.end) meta.end=dd[1]; }

      if(!spans) continue;
      if(JUNK.some(rx=>rx.test(joined))) continue;
      if(/Begin Date|End Date|Team Member/.test(joined)) continue;

      /* --- split the line into the ten columns --- */
      const cells={}; COLNAMES.forEach(c=>cells[c]='');
      const numStart = spans[4][0]-12;
      for(const it of ln){
        for(const t of splitToken(it, numStart)){
          const cen=(t.x0+t.x1)/2;
          let ci;
          if(cen > numStart){                       // numeric block: right-aligned
            ci=4; let best=Infinity;
            for(let k=4;k<10;k++){ const d=Math.abs(t.x1-spans[k][1]); if(d<best){best=d;ci=k;} }
          }else{                                    // text block: left-aligned
            ci=0;
            for(let k=0;k<4;k++){ if(t.x0+6 >= spans[k][0]) ci=k; }
          }
          const c=COLNAMES[ci];
          cells[c] = (ci>=4) ? cells[c]+t.s : (cells[c]? cells[c]+' '+t.s : t.s);
        }
      }

      const hasMoney = /PKR|Rs\.?\s*\d/.test(cells.net);
      const onlyCat  = cells.cat && COLNAMES.slice(1).every(c=>!cells[c]);

      if(onlyCat){ push(); currentCat = cells.cat.replace(/\s+/g,' ').trim(); continue; }
      if(hasMoney){
        push();
        rec = Object.assign({}, cells);
        if(rec.cat) currentCat = rec.cat.replace(/\s+/g,' ').trim();
        rec.cat = currentCat;
      } else if(rec){
        for(const c of COLNAMES){
          if(!cells[c] || c==='cat') continue;
          if(c==='net'||c==='qty') rec[c] = (rec[c]||'')+cells[c];               // split decimals rejoin
          else if(['pmix','smix','orders','pop'].indexOf(c)>=0) rec[c] = rec[c] || cells[c];
          else rec[c] = (rec[c]? rec[c]+' ':'') + cells[c];                       // wrapped names
        }
      }
    }
    push();
  }
  push();

  if(!rows.length) throw new Error('No product rows found. This needs to be a Pulse "Product Mix" PDF export — a scan or screenshot will not work.');

  const ests = rows.filter(r=>r.pop>0.005 && r.orders>0).map(r=>r.orders/r.pop).sort((a,b)=>a-b);
  const totalOrders = ests.length ? Math.round(ests[Math.floor(ests.length/2)])
                                  : rows.reduce((m,r)=>Math.max(m,r.orders),0);

  const b = parseDate(meta.begin), e = parseDate(meta.end);
  const days = (b&&e) ? Math.max(1,Math.round((e-b)/864e5)+1) : 30;
  const id = b ? b.getFullYear()+'-'+String(b.getMonth()+1).padStart(2,'0') : 'file-'+Date.now();
  const label = b ? MONTHS[b.getMonth()]+' '+b.getFullYear() : file.name.replace(/\.pdf$/i,'');

  const smixSum = sum(rows,r=>r.smix);
  if(smixSum < .5 || smixSum > 1.6) warnings.push('Sales-mix percentages add up to '+PCT(smixSum)+' instead of 100%. The report may be partially cut off.');

  return {id, label, begin:meta.begin, end:meta.end, days, store:meta.store, member:meta.member,
          rows, totalOrders, warnings, file:file.name, added:Date.now()};
}

/* Map the header row to ten [start,end] x-spans. Works whether the PDF emits
   one text run per word or one per phrase. */
function headerSpans(ln){
  let str=''; const map=[];
  for(const it of ln){
    const t=it.s;
    if(str && !/\s$/.test(str) && !/^\s/.test(t)){ str+=' '; map.push({x0:it.x,x1:it.x}); }
    for(let i=0;i<t.length;i++){
      map.push({x0: it.x + it.w*(i/t.length), x1: it.x + it.w*((i+1)/t.length)});
    }
    str += t;
  }
  const spans=[]; let cursor=0;
  for(const h of HEADS){
    const i = str.indexOf(h, cursor);
    if(i<0) return null;
    const a=map[i], b=map[Math.min(map.length-1, i+h.length-1)];
    if(!a||!b) return null;
    spans.push([a.x0, b.x1]);
    cursor = i + h.length;
  }
  for(let k=1;k<spans.length;k++) if(spans[k][0] <= spans[k-1][0]) return null;
  return spans;
}

/* A run like "PKR60,156.5 110" must not be treated as one cell. Split on
   whitespace and apportion the width so each token keeps its own edges. */
function splitToken(it, numStart){
  const raw = it.s;
  const x0 = it.x, x1 = it.x + it.w;
  const trimmed = raw.trim();
  if(!trimmed) return [];
  if(!/\s/.test(trimmed) || (x0+it.w/2) <= numStart) return [{s:trimmed, x0, x1}];
  const parts=[]; const re=/\S+/g; let m;
  while((m=re.exec(raw))!==null){
    const a = x0 + it.w*(m.index/raw.length);
    const b = x0 + it.w*((m.index+m[0].length)/raw.length);
    parts.push({s:m[0], x0:a, x1:b});
  }
  return parts;
}

function parseDate(s){ if(!s) return null; const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(!m) return null; return new Date(+m[3], +m[1]-1, +m[2]); }

/* =====================================================================
   METRIC ENGINE — the 50 KPIs
   ===================================================================== */
function groupBy(rows, key){
  const m = new Map();
  for(const r of rows){ const k = typeof key==='function'? key(r): r[key]; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); }
  return m;
}
function rollup(rows, key){
  const out=[];
  for(const [k,rs] of groupBy(rows,key)){
    out.push({key:k, net:sum(rs,r=>r.net), qty:sum(rs,r=>r.qty), orders:sum(rs,r=>r.orders), n:rs.length,
              unit: sum(rs,r=>r.qty)? sum(rs,r=>r.net)/sum(rs,r=>r.qty):0, rows:rs});
  }
  return out.sort((a,b)=>b.net-a.net);
}
const skuKey = r => [r.item, r.size, r.crust].filter(Boolean).join(' · ');

function compute(M, costs){
  costs = costs || {};
  const rows  = M.rows;
  const food  = rows.filter(isFood);
  const fees  = rows.filter(r=>!isFood(r));
  const sales = sum(food,r=>r.net);
  const units = sum(food,r=>r.qty);
  const orders= M.totalOrders || 1;
  const days  = M.days || 30;

  const byCat  = rollup(food, 'cat');
  const bySku  = rollup(food, skuKey);
  const pizzas = food.filter(isPizza);
  const attach = cats => sum(food.filter(r=>cats.indexOf(r.cat)>=0), r=>r.orders)/orders;

  // Pareto
  const sorted=[...bySku].sort((a,b)=>b.net-a.net); let run=0, p80=0;
  for(const s of sorted){ run+=s.net; p80++; if(run>=sales*.8) break; }

  // margin (real when cost supplied, price-proxy otherwise)
  const catAvgUnit = {}; byCat.forEach(c=> catAvgUnit[c.key]=c.unit);
  const sku = bySku.map(s=>{
    const r0 = s.rows[0];
    const cost = costs[s.key];
    const hasCost = cost!=null && cost>0;
    const unitCost = hasCost ? (cost<=1 ? s.unit*cost : cost) : null;   // <=1 treated as a food-cost ratio
    const margin = hasCost ? s.unit-unitCost : s.unit - (catAvgUnit[r0.cat]||s.unit);
    return {...s, cat:r0.cat, item:r0.item, size:r0.size, crust:r0.crust,
            hasCost, unitCost, margin, marginPct: hasCost? (s.unit-unitCost)/s.unit : null,
            contrib: hasCost ? (s.unit-unitCost)*s.qty : null,
            qtyShare: s.qty/units, netShare: s.net/sales,
            eff: (s.net/sales)/((s.qty/units)||1)};
  });

  // menu-engineering quadrants, computed inside each category
  const catQty = {}; byCat.forEach(c=> catQty[c.key]=c.qty);
  const catCount={}; sku.forEach(s=> catCount[s.cat]=(catCount[s.cat]||0)+1);
  sku.forEach(s=>{
    const popCut  = 0.7 * (1/(catCount[s.cat]||1));
    const popular = (s.qty/(catQty[s.cat]||1)) >= popCut;
    const profitable = s.hasCost ? s.margin >= median(sku.filter(x=>x.cat===s.cat&&x.hasCost).map(x=>x.margin))
                                 : s.unit >= (catAvgUnit[s.cat]||0);
    s.pop_ = popular; s.prof_ = profitable;
    s.quad = popular ? (profitable?'Star':'Plow-horse') : (profitable?'Puzzle':'Dog');
  });

  const q = n => sku.filter(s=>s.quad===n);
  const starShare = sum(q('Star'),s=>s.net)/sales;

  // pizza detail
  const pzQty  = sum(pizzas,r=>r.qty)||1;
  const bySize = rollup(pizzas,'size').sort((a,b)=>SIZE_ORDER.indexOf(a.key)-SIZE_ORDER.indexOf(b.key));
  const byCrust= rollup(pizzas,'crust');
  const byFlav = rollup(pizzas,'item');
  const premQty= sum(pizzas.filter(r=>PREMIUM.indexOf(r.crust)>=0),r=>r.qty);
  const panQty = sum(pizzas.filter(r=>r.crust==='Pan'),r=>r.qty);
  const panUnit= (()=>{const p=pizzas.filter(r=>r.crust==='Pan');return sum(p,r=>r.qty)?sum(p,r=>r.net)/sum(p,r=>r.qty):0;})();
  const premUnit=(()=>{const p=pizzas.filter(r=>PREMIUM.indexOf(r.crust)>=0);return sum(p,r=>r.qty)?sum(p,r=>r.net)/sum(p,r=>r.qty):0;})();
  const med = pizzas.filter(r=>r.size==='10"-Medium' && r.crust==='Pan');
  const lrg = pizzas.filter(r=>r.size==='12"-Large' && r.crust==='Pan');
  const medUnit = sum(med,r=>r.qty)? sum(med,r=>r.net)/sum(med,r=>r.qty):0;
  const lrgUnit = sum(lrg,r=>r.qty)? sum(lrg,r=>r.net)/sum(lrg,r=>r.qty):0;
  const medQty  = sum(med,r=>r.qty);

  // dip flavour preference
  const dips = rollup(food.filter(r=>CAT_DIP.indexOf(r.cat)>=0),'item');
  const dipTotal = sum(dips,d=>d.qty)||1;

  const deliveryOrders = sum(fees.filter(r=>/delivery fee/i.test(r.item)), r=>r.orders);
  const aggOrders      = sum(fees.filter(r=>/panda|platform|aggregat/i.test(r.item)), r=>r.orders);
  const feeTotal       = sum(fees,r=>r.net);
  const aggFees        = sum(fees.filter(r=>/panda|platform/i.test(r.item)), r=>r.net);

  const m = {
    /* 1-6 headline */
    sales, units, orders, aov: sales/orders, upo: units/orders, asp: units? sales/units:0,
    days, salesPerDay: sales/days, ordersPerDay: orders/days,
    /* 7-14 movers */
    topRev: [...sku].sort((a,b)=>b.net-a.net).slice(0,20),
    topQty: [...sku].sort((a,b)=>b.qty-a.qty).slice(0,20),
    slow:   [...sku].filter(s=>s.qty<=5).sort((a,b)=>a.qty-b.qty).slice(0,30),
    dead:   sku.filter(s=>s.qty<=2),
    p80, p80pct:p80/sku.length,
    longTail: sku.filter(s=>s.netShare<0.01).length/sku.length,
    revPerSku: sales/sku.length,
    skuCount: sku.length,
    /* 15-18 category */
    byCat: byCat.map(c=>({...c, revShare:c.net/sales, qtyShare:c.qty/units, ticket:c.orders? c.net/c.orders:0, attach:c.orders/orders})),
    /* 19-24 pizza */
    bySize: bySize.map(s=>({...s, share:s.qty/pzQty})),
    byCrust: byCrust.map(c=>({...c, share:c.qty/pzQty})),
    byFlav: byFlav.slice(0,15).map(f=>({...f, share:f.qty/pzQty})),
    pizzaQty: pzQty, pizzaNet: sum(pizzas,r=>r.net),
    premPen: premQty/pzQty, panDep: panQty/pzQty, panUnit, premUnit,
    medUnit, lrgUnit, medQty, upsizeDelta: Math.max(0,lrgUnit-medUnit),
    /* 25-28 attach */
    atSides: attach(CAT_SIDES), atDess: attach(CAT_DESS), atDrink: attach(CAT_DRINK), atDip: attach(CAT_DIP),
    dips: dips.map(d=>({...d, share:d.qty/dipTotal})),
    /* 29-30 channel */
    deliveryOrders, aggOrders, deliveryPen: deliveryOrders/orders, aggPen: aggOrders/orders,
    ownPen: Math.max(0,(orders-aggOrders)/orders), feeTotal, aggFees, feeLeak: aggFees/sales,
    /* 41-45 pricing */
    catAvgUnit,
    upsizeValue: Math.max(0,lrgUnit-medUnit) * medQty * 0.10,
    premUplift: Math.max(0,premUnit-panUnit) * premQty,
    /* 46-50 basket & risk */
    addonPerOrder: Math.max(0,(units - sum(pizzas,r=>r.qty))/orders),
    comboPen: sum(food.filter(r=>r.cat==='MyBox'||r.cat==='LddPizza'), r=>r.orders)/orders,
    top5Conc: sum([...sku].sort((a,b)=>b.net-a.net).slice(0,5), s=>s.net)/sales,
    /* menu engineering */
    sku, quads:{Star:q('Star'),'Plow-horse':q('Plow-horse'),Puzzle:q('Puzzle'),Dog:q('Dog')},
    starShare, hasCosts: sku.some(s=>s.hasCost),
    contribTotal: sum(sku.filter(s=>s.hasCost), s=>s.contrib),
    velocity: sku.filter(s=>s.qty>0).length/sku.length,
    avgDessPrice: avgUnit(food,CAT_DESS), avgDrinkPrice: avgUnit(food,CAT_DRINK),
    avgSidePrice: avgUnit(food,CAT_SIDES), avgDipPrice: avgUnit(food,CAT_DIP)
  };
  /* KPI 42-43 price realization: current price against the best price this item
     has ever achieved across every loaded month = a proxy for list price */
  m.realization = m.sku.map(s=>{
    const list = (window.__listPrice && window.__listPrice[s.key]) || s.unit;
    return {...s, list, real: list? s.unit/list : 1};
  }).filter(s=>s.qty>=5).sort((a,b)=>a.real-b.real);
  m.leaks = m.realization.filter(s=>s.real<0.90);

  /* KPI 49 co-occurrence proxy: how often each add-on group rides along with each main group */
  const mains=['Pizza','LddPizza','MyBox','Pockets','Chicken'];
  m.cooc = mains.filter(x=>byCat.some(c=>c.key===x)).map(x=>{
    const mo = (byCat.find(c=>c.key===x)||{orders:0}).orders;
    return {main:x, orders:mo, share:mo/orders,
            sides:m.atSides, drink:m.atDrink, dess:m.atDess, dip:m.atDip};
  });
  m.health = healthScore(m);
  return m;
}
function avgUnit(rows,cats){ const r=rows.filter(x=>cats.indexOf(x.cat)>=0); const q=sum(r,x=>x.qty); return q? sum(r,x=>x.net)/q : 0; }
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); const i=Math.floor(s.length/2); return s.length%2? s[i] : (s[i-1]+s[i])/2; }

function healthScore(m){
  const parts = [
    {k:'Star revenue share', v:clamp(m.starShare/0.45,0,1),         hint:'Share of sales coming from Star items'},
    {k:'Dead SKU load',      v:clamp(1-(m.dead.length/Math.max(1,m.skuCount))/0.25,0,1), hint:'Items selling 2 units or fewer'},
    {k:'Menu focus',         v:clamp(1-(m.p80pct-0.15)/0.45,0,1),   hint:'How few items make 80% of sales'},
    {k:'Menu velocity',      v:clamp(m.velocity,0,1),               hint:'Share of listed items that actually sold'},
    {k:'Premium crust pull', v:clamp(m.premPen/0.25,0,1),           hint:'Pizzas sold on an upgraded crust'},
    {k:'Attach strength',    v:clamp((m.atSides+m.atDess+m.atDrink+m.atDip)/2.2,0,1), hint:'Sides, desserts, drinks and dips per order'}
  ];
  const score = Math.round(sum(parts,p=>p.v)/parts.length*100);
  return {score, parts};
}

/* Approximate Islamic-calendar trading events for Pakistan. Moon-sighting moves
   these by a day or two, so they are flagged as approximate wherever shown. */
const SEASON = {
  2024:{ram:['2024-03-11','2024-04-09'],fitr:'2024-04-10',adha:'2024-06-16'},
  2025:{ram:['2025-03-01','2025-03-30'],fitr:'2025-03-31',adha:'2025-06-07'},
  2026:{ram:['2026-02-17','2026-03-19'],fitr:'2026-03-20',adha:'2026-05-27'},
  2027:{ram:['2027-02-07','2027-03-08'],fitr:'2027-03-09',adha:'2027-05-16'},
  2028:{ram:['2028-01-27','2028-02-25'],fitr:'2028-02-26',adha:'2028-05-05'}
};
function seasonTags(M){
  const b=parseDate(M.begin), e=parseDate(M.end); if(!b||!e) return [];
  const y=SEASON[b.getFullYear()]; if(!y) return [];
  const inRange=d=>{ const x=new Date(d); return x>=b && x<=e; };
  const overlap=(a,z)=>{ const s1=new Date(a), s2=new Date(z); return s1<=e && s2>=b; };
  const t=[];
  if(overlap(y.ram[0],y.ram[1])) t.push({k:'Ramadan',note:'Daytime trade collapses, evening trade spikes. Compare like for like.'});
  if(inRange(y.fitr)) t.push({k:'Eid al-Fitr',note:'Multi-day family ordering peak.'});
  if(inRange(y.adha)) t.push({k:'Eid al-Adha',note:'Home meat cooking pulls demand away from pizza for two to three days.'});
  const mo=b.getMonth();
  if(mo>=4&&mo<=6) t.push({k:'Exam season',note:'Late-night student delivery runs higher.'});
  if(mo===11||mo===0) t.push({k:'Winter peak',note:'Delivery demand rises with cold weather.'});
  return t;
}
/* Sibling cannibalisation: one variant of an item climbs while another falls,
   with the family total barely moving. */
function cannibalisation(cur, prev){
  if(!prev) return [];
  const fam=new Map();
  const add=(m,tag)=>{ for(const s of m.sku){ if(!fam.has(s.item)) fam.set(s.item,{now:[],was:[]}); fam.get(s.item)[tag].push(s); } };
  add(cur,'now'); add(prev,'was');
  const out=[];
  for(const [item,f] of fam){
    if(f.now.length<2 || !f.was.length) continue;
    const wasMap=new Map(f.was.map(s=>[s.key,s]));
    const moves=f.now.map(s=>({key:s.key, d:s.qty-((wasMap.get(s.key)||{qty:0}).qty), qty:s.qty}))
                     .filter(x=>Math.abs(x.d)>=4);
    if(moves.length<2) continue;
    const up=moves.filter(x=>x.d>0).sort((a,b)=>b.d-a.d)[0];
    const dn=moves.filter(x=>x.d<0).sort((a,b)=>a.d-b.d)[0];
    if(!up||!dn) continue;
    const totNow=sum(f.now,s=>s.qty), totWas=sum(f.was,s=>s.qty);
    const swing=totWas? Math.abs(totNow-totWas)/totWas : 1;
    if(swing<=0.12 && Math.min(up.d,-dn.d)>=4)
      out.push({item, up:up.key, upD:up.d, down:dn.key, downD:dn.d, total:totNow, swing});
  }
  return out.sort((a,b)=>b.upD-a.upD).slice(0,10);
}

/* comparison between two computed metric sets */
function delta(cur, prev, key, perDay){
  if(!prev) return null;
  const a = perDay ? cur[key]/cur.days : cur[key];
  const b = perDay ? prev[key]/prev.days : prev[key];
  if(b==null || b===0) return null;
  return {abs:a-b, pct:(a-b)/Math.abs(b), a, b};
}
</script>


<script>
/* =====================================================================
   CHARTS — hand-rolled SVG, no dependencies
   ===================================================================== */
const C = {ink:'#151A21',flame:'#C8102E',navy:'#0B5AA8',tape:'#F2C230',moss:'#2E7D4F',steel:'#5A6675',line:'#D7DDE4'};
const PALETTE = ['#0B5AA8','#C8102E','#F2C230','#2E7D4F','#6B4E9E','#2E8B94','#B5651D','#8A94A2','#4C5A6B','#9E2B5C','#3F7F3F','#A67C00'];

function barChart(data,{h=250,fmt=NUM,color=C.navy,label='key'}={}){
  if(!data.length) return '<p class="mini">No data.</p>';
  const max = Math.max(...data.map(d=>d.value))||1;
  const bh=20, gap=7, top=6, w=760, lw=210;
  const H = top + data.length*(bh+gap);
  let out = '<svg viewBox="0 0 '+w+' '+Math.max(H,40)+'" style="width:100%;height:auto;max-height:'+(h*2)+'px" role="img">';
  data.forEach((d,i)=>{
    const y = top + i*(bh+gap);
    const bw = Math.max(1,(w-lw-90)*(d.value/max));
    out += '<text x="0" y="'+(y+14)+'" font-size="11.5" fill="'+C.ink+'">'+esc(String(d[label]).slice(0,34))+'</text>';
    out += '<rect x="'+lw+'" y="'+y+'" width="'+bw+'" height="'+bh+'" fill="'+(d.color||color)+'" rx="1.5"/>';
    out += '<text x="'+(lw+bw+7)+'" y="'+(y+14)+'" font-size="11" fill="'+C.steel+'">'+fmt(d.value)+'</text>';
  });
  return out+'</svg>';
}
function donut(data,{fmt=PCT}={}){
  const tot = sum(data,d=>d.value)||1; let a=-Math.PI/2;
  const cx=105,cy=105,r=88,ir=52;
  let arcs='';
  data.forEach((d,i)=>{
    const ang = (d.value/tot)*Math.PI*2, b=a+ang;
    const x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(b), y2=cy+r*Math.sin(b);
    const x3=cx+ir*Math.cos(b), y3=cy+ir*Math.sin(b), x4=cx+ir*Math.cos(a), y4=cy+ir*Math.sin(a);
    const la = ang>Math.PI?1:0;
    arcs += '<path d="M'+x1+' '+y1+' A'+r+' '+r+' 0 '+la+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+ir+' '+ir+' 0 '+la+' 0 '+x4+' '+y4+' Z" fill="'+PALETTE[i%PALETTE.length]+'"/>';
    a=b;
  });
  let leg='<div class="legend">';
  data.forEach((d,i)=> leg += '<span><i style="background:'+PALETTE[i%PALETTE.length]+'"></i>'+esc(d.key)+' '+fmt(d.value/tot)+'</span>');
  leg+='</div>';
  return '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 210 210" style="width:190px;height:190px;flex:0 0 190px">'+arcs+'</svg><div style="flex:1;min-width:180px">'+leg+'</div></div>';
}
function lineChart(series,labels,{fmt=K,h=230,yTitle=''}={}){
  const w=760, pad={l:62,r:14,t:14,b:34};
  const all = series.flatMap(s=>s.values.filter(v=>v!=null));
  if(!all.length) return '<p class="mini">Not enough months yet.</p>';
  const mx=Math.max(...all), mn=Math.min(0,Math.min(...all));
  const X = i => pad.l + (labels.length<2?0:(w-pad.l-pad.r)*(i/(labels.length-1)));
  const Y = v => h-pad.b - (h-pad.t-pad.b)*((v-mn)/((mx-mn)||1));
  let g='';
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v);
    g+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="'+C.line+'" stroke-dasharray="2 3"/>'+
       '<text x="'+(pad.l-7)+'" y="'+(y+4)+'" font-size="10" fill="'+C.steel+'" text-anchor="end">'+fmt(v)+'</text>'; }
  series.forEach((s,si)=>{
    const col = s.color||PALETTE[si%PALETTE.length];
    const pts = s.values.map((v,i)=> v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(pts.length>1) g+='<polyline fill="none" stroke="'+col+'" stroke-width="2.2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
    pts.forEach(p=> g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.6" fill="#fff" stroke="'+col+'" stroke-width="2.2"/>');
  });
  labels.forEach((l,i)=> g+='<text x="'+X(i)+'" y="'+(h-11)+'" font-size="10" fill="'+C.steel+'" text-anchor="middle">'+esc(l)+'</text>');
  let leg = series.length>1? '<div class="legend">'+series.map((s,i)=>'<span><i style="background:'+(s.color||PALETTE[i%PALETTE.length])+'"></i>'+esc(s.name)+'</span>').join('')+'</div>':'';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+g+'</svg>'+leg;
}
function scatterMatrix(items,{h=430}={}){
  const w=760, pad={l:56,r:20,t:20,b:44};
  if(!items.length) return '<p class="mini">No data.</p>';
  const xs=items.map(i=>i.x), ys=items.map(i=>i.y);
  const xmax=Math.max(...xs)*1.08||1, ymin=Math.min(...ys), ymax=Math.max(...ys);
  const yr=(ymax-ymin)||1;
  const X=v=>pad.l+(w-pad.l-pad.r)*(v/xmax);
  const Y=v=>h-pad.b-(h-pad.t-pad.b)*((v-ymin+yr*.08)/(yr*1.16));
  const xc=X(items.xcut!=null?items.xcut:0), yc=Y(0);
  const cx=X(median(xs)), cy=Y(median(ys));
  const QC={'Star':'#C79A00','Plow-horse':C.navy,'Puzzle':'#6B4E9E','Dog':C.flame};
  let g='<rect x="'+pad.l+'" y="'+pad.t+'" width="'+(w-pad.l-pad.r)+'" height="'+(h-pad.t-pad.b)+'" fill="#FAFBFC" stroke="'+C.line+'"/>';
  g+='<line x1="'+cx+'" y1="'+pad.t+'" x2="'+cx+'" y2="'+(h-pad.b)+'" stroke="'+C.steel+'" stroke-dasharray="4 4"/>';
  g+='<line x1="'+pad.l+'" y1="'+cy+'" x2="'+(w-pad.r)+'" y2="'+cy+'" stroke="'+C.steel+'" stroke-dasharray="4 4"/>';
  const stencil=(t,x,y,anc)=>'<text x="'+x+'" y="'+y+'" font-size="26" fill="#E9EDF1" font-weight="700" text-anchor="'+anc+'" letter-spacing="3">'+t+'</text>';
  g+=stencil('STARS',w-pad.r-12,pad.t+30,'end')+stencil('PUZZLES',pad.l+12,pad.t+30,'start')
    +stencil('PLOW-HORSES',w-pad.r-12,h-pad.b-12,'end')+stencil('DOGS',pad.l+12,h-pad.b-12,'start');
  const maxN=Math.max(...items.map(i=>i.net))||1;
  items.forEach(it=>{
    const r=4+10*Math.sqrt(it.net/maxN);
    g+='<circle cx="'+X(it.x)+'" cy="'+Y(it.y)+'" r="'+r.toFixed(1)+'" fill="'+(QC[it.quad]||C.steel)+'" fill-opacity=".62" stroke="'+(QC[it.quad]||C.steel)+'" stroke-width="1.2"><title>'+esc(it.label)+'\nQty '+NUM(it.qty)+' · '+PKR(it.net)+' · '+it.quad+'</title></circle>';
  });
  g+='<text x="'+(w/2)+'" y="'+(h-10)+'" font-size="10.5" fill="'+C.steel+'" text-anchor="middle">POPULARITY  →  units sold</text>';
  g+='<text x="14" y="'+(h/2)+'" font-size="10.5" fill="'+C.steel+'" text-anchor="middle" transform="rotate(-90 14 '+(h/2)+')">PROFITABILITY  →  margin per unit</text>';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+g+'</svg>';
}

/* =====================================================================
   APP STATE + SHELL

const APP = {months:[], cur:null, cmp:null, basis:'raw', costs:{}, targets:{}, plan:{}, sort:{}};
const PAGES = [
  ['upload','Files'],['overview','Overview'],['movers','Movers'],['pizza','Pizza mix'],
  ['menu','Menu engineering'],['trends','Trends'],['coach','Coaching'],['kpis','All 50 KPIs'],
  ['data','Data table'],['setup','Setup']
];
let PAGE='upload';

function buildNav(){
  $('#nav').innerHTML = PAGES.map((p,i)=>
    '<button data-p="'+p[0]+'" class="'+(p[0]===PAGE?'on':'')+'"><span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+p[1]+'</button>').join('');
  $$('#nav button').forEach(b=> b.onclick=()=>go(b.dataset.p));
}
function closeRail(){ $('.rail').classList.remove('open'); $('#scrim').classList.remove('open'); }
function go(id){
  PAGE=id;
  $$('.page').forEach(s=>s.classList.remove('on'));
  $('#p-'+id).classList.add('on');
  $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.p===id));
  const lbl=(PAGES.find(x=>x[0]===id)||['',''])[1];
  if($('#nowPage')) $('#nowPage').textContent=lbl;
  closeRail(); window.scrollTo(0,0);
  render();
}
function M(){ return APP.months.find(m=>m.id===APP.cur) || null; }
function P(){ return APP.months.find(m=>m.id===APP.cmp) || null; }
function buildListPrices(){
  const lp={};
  for(const m of APP.months){
    for(const r of m.rows){
      if(!isFood(r)) continue;
      const k=[r.item,r.size,r.crust].filter(Boolean).join(' · ');
      if(!lp[k] || r.unit>lp[k]) lp[k]=r.unit;
    }
  }
  window.__listPrice=lp;
}
function metrics(m){ return m? compute(m, APP.costs) : null; }
function perDay(){ return APP.basis==='day'; }

async function boot(){
  buildNav();
  APP.months  = (await store.get('pulse:months'))  || [];
  APP.costs   = (await store.get('pulse:costs'))   || {};
  APP.targets = (await store.get('pulse:targets')) || {};
  APP.plan    = (await store.get('pulse:plan'))    || {};
  APP.months.sort((a,b)=>a.id.localeCompare(b.id));
  buildListPrices();
  if(APP.months.length){ APP.cur = APP.months[APP.months.length-1].id; APP.cmp = APP.months.length>1? APP.months[APP.months.length-2].id : ''; }
  if(APP.months.length) go('overview'); else render();
}
async function saveMonths(){ APP.months.sort((a,b)=>a.id.localeCompare(b.id)); buildListPrices(); await store.set('pulse:months', APP.months); }

function refreshStrip(){
  const strip=$('#strip');
  if(!APP.months.length){ strip.hidden=true; return; }
  strip.hidden = (PAGE==='upload'||PAGE==='setup');
  $('#mSel').innerHTML = APP.months.map(m=>'<option value="'+m.id+'"'+(m.id===APP.cur?' selected':'')+'>'+esc(m.label)+'</option>').join('');
  const others = APP.months.filter(m=>m.id!==APP.cur);
  $('#cSel').innerHTML = '<option value="">No comparison</option>'
    + (prevMonthId()? '<option value="'+prevMonthId()+'"'+(APP.cmp===prevMonthId()?' selected':'')+'>Previous month</option>':'')
    + others.map(m=>'<option value="'+m.id+'"'+(m.id===APP.cmp?' selected':'')+'>'+esc(m.label)+'</option>').join('');
  const m=M();
  $('#stripMeta').innerHTML = m? esc(m.store||'Store')+'<br>'+esc(m.begin)+' → '+esc(m.end)+' · '+m.days+' days · '+NUM(m.rows.length)+' rows' : '';
  $$('#basis button').forEach(b=>b.classList.toggle('on', b.dataset.b===APP.basis));
}
function prevMonthId(){
  const i = APP.months.findIndex(m=>m.id===APP.cur);
  return i>0? APP.months[i-1].id : '';
}

/* =====================================================================
   PAGE: FILES
   ===================================================================== */
function pageUpload(){
  const list = APP.months.length ? `
    <div class="tw" style="max-height:none">
      <table><thead><tr><th>Month</th><th>Period</th><th class="r">Days</th><th class="r">Rows</th>
      <th class="r">Net sales</th><th class="r">Orders</th><th>Health</th><th>File</th><th></th></tr></thead><tbody>
      ${APP.months.map(m=>{ const mm=metrics(m); return `<tr>
        <td><b>${esc(m.label)}</b></td><td class="mono">${esc(m.begin)} → ${esc(m.end)}</td>
        <td class="r mono">${m.days}</td><td class="r mono">${NUM(m.rows.length)}</td>
        <td class="r mono">${PKR(mm.sales)}</td><td class="r mono">${NUM(mm.orders)}</td>
        <td>${m.warnings.length? '<span class="tag t-dog">'+m.warnings.length+' warnings</span>':'<span class="tag t-star">clean</span>'}</td>
        <td class="mono" style="color:var(--mute)">${esc(m.file||'')}</td>
        <td class="r"><button class="btn ghost sm" data-del="${m.id}">Remove</button></td></tr>`;}).join('')}
      </tbody></table>
    </div>` : '';

  const warns = APP.months.flatMap(m=>m.warnings.map(w=>({m:m.label,w}))).slice(0,12);

  $('#p-upload').innerHTML = `
    <div style="padding-top:26px">
      <div class="eyebrow">Step one</div>
      <h1>Load your Pulse product-mix reports</h1>

      <div class="drop" id="drop">

      ${list? '<h2 style="margin:26px 0 10px">Month library</h2>'+list : ''}
      ${warns.length? '<div class="note" style="margin-top:14px"><b>Parse warnings</b><br>'+warns.map(x=>esc(x.m)+': '+esc(x.w)).join('<br>')+'</div>':''}
      ${APP.months.length? '<div class="row" style="margin-top:16px"><button class="btn red" id="goOv">Open dashboard</button></div>':''}
    </div>`;

  const drop=$('#drop'), inp=$('#file');
  $('#pick').onclick=e=>{e.preventDefault();inp.click()};

  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot')}));
  drop.addEventListener('drop',e=>ingest(e.dataTransfer.files));
  $$('[data-del]').forEach(b=> b.onclick=async()=>{
    APP.months = APP.months.filter(m=>m.id!==b.dataset.del);
    if(APP.cur===b.dataset.del) APP.cur = APP.months.length? APP.months[APP.months.length-1].id : null;

  if($('#goOv')) $('#goOv').onclick=()=>go('overview');

async function ingest(files){
  const fs=Array.from(files||[]).filter(f=>/pdf$/i.test(f.name));
  if(!fs.length){ toast('Only PDF files can be read.'); return; }
  const prog=$('#prog');
  for(const f of fs){
    prog.innerHTML='<span class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:#151A21"></span> Reading '+esc(f.name)+'…';
    try{
      const m = await parsePDF(f,(p,t)=> prog.textContent='Reading '+f.name+' — page '+p+' of '+t);
      const i = APP.months.findIndex(x=>x.id===m.id);
      if(i>=0){ APP.months[i]=m; toast('Replaced '+esc(m.label)+' — '+NUM(m.rows.length)+' rows.'); }
      else { APP.months.push(m); toast('Added '+esc(m.label)+' — '+NUM(m.rows.length)+' rows, '+PKR(sum(m.rows.filter(isFood),r=>r.net))+'.'); }
      APP.cur=m.id; APP.cmp=prevMonthId();
    }catch(err){
      prog.innerHTML=''; 
      $('#p-upload').insertAdjacentHTML('beforeend','<div class="warn" style="margin-top:14px"><b>'+esc(f.name)+' could not be read.</b><br>'+esc(err.message)+'</div>');
      continue;
    }
  }
  prog.textContent='';
  await saveMonths(); render();
}

/* =====================================================================
   PAGE: OVERVIEW  (KPI 1–6, 15–18, 25–30, 31–34)
   ===================================================================== */
function tile(n,label,value,d,prevLabel,fmt){
  const cls = d? dg(d.pct):'flat';
  return `<div class="kpi"><span class="n">${n}</span><div class="k">${esc(label)}</div>
    <div class="v num">${value}</div>
    ${d? `<div class="d ${cls}"><span>${arrow(d.pct)} ${(d.pct*100).toFixed(1)}%</span>
      <span class="prev">${prevLabel||''} ${fmt?fmt(d.b):''}</span></div>`
       : '<div class="d flat"><span class="prev">no comparison</span></div>'}</div>`;
}
function pageOverview(){
  const m=M(); if(!m){ $('#p-overview').innerHTML=empty(); return; }
  const c=metrics(m), p=metrics(P()), pd=perDay(), div=pd?c.days:1, pdiv=(pd&&P())?P().days:1;
  const D=(k,f)=>{ if(!p) return null; const a=c[k]/(f?div:1), b=p[k]/(f?pdiv:1); return b?{abs:a-b,pct:(a-b)/Math.abs(b),a,b}:null; };
  const pl = P()? P().label : '';

  // growth decomposition (KPI 33)
  let decomp='';
  if(p){
    const dO=c.orders-p.orders, dA=c.aov-p.aov;
    const fromOrders=dO*p.aov, fromAov=dA*c.orders;
    decomp = `<div class="card"><h3>Where the change came from</h3>
      <div class="cap">KPI 33 · sales change split into traffic vs basket size</div>
      ${barChart([
        {key:'More / fewer orders', value:Math.abs(fromOrders), color:fromOrders>=0?C.moss:C.flame},

      ],{fmt:PKR})}
      <p class="summary" style="margin-top:10px">Orders moved <b>${NUM(dO)}</b> (${PKR(fromOrders)} effect) and average
      order value moved <b>${PKR(dA)}</b> (${PKR(fromAov)} effect). ${
        Math.abs(fromOrders)>Math.abs(fromAov)
        ? 'The swing is mostly <b>traffic</b> — marketing, delivery reach and aggregator visibility are the levers.'
        : 'The swing is mostly <b>basket size</b> — upselling, attach rate and pricing are the levers.'}</p></div>`;
  }

  const catRows = c.byCat.map(x=>{
    const pc = p? p.byCat.find(y=>y.key===x.key) : null;

  $('#p-overview').innerHTML = `

      ${tile(3,'Orders', NUM(c.orders/div), D('orders',true), pl, NUM)}
      ${tile(4,'Average order value', PKR(c.aov), D('aov'), pl, PKR)}
      ${tile(5,'Units per order', c.upo.toFixed(2), D('upo'), pl, x=>x.toFixed(2))}

    </div>

    <div class="grid g2">

      <div class="card"><h3>Ticket, units and attach by category</h3><div class="cap">KPI 16–18 · revenue share against unit share tells you which categories are cheap volume</div>
        <div class="tw" style="max-height:300px"><table><thead><tr><th>Category</th><th class="r">Net</th><th class="r">Rev share</th>
          <th class="r">Unit share</th><th class="r">Orders</th><th class="r">Ticket</th></tr></thead><tbody>
        ${catRows.map(x=>`<tr><td>${esc(x.key)}</td><td class="r mono">${PKRk(x.net)}</td><td class="r mono">${PCT(x.revShare)}</td>
          <td class="r mono">${PCT(x.qtyShare)}</td><td class="r mono">${NUM(x.orders)}</td>

        </tbody></table></div></div>
    </div>

    ${decomp}

    <div class="card"><h3>Mix shift heatmap</h3>
      <div class="cap">KPI 34 · percentage points of sales share gained or lost against ${esc(pl||'—')}</div>
      ${p? `<div class="heat">${catRows.filter(x=>x.dShare!=null).sort((a,b)=>b.dShare-a.dShare).map(x=>{
          const v=x.dShare, i=clamp(Math.abs(v)/0.04,0,1);

          const fg = i>0.55? '#fff':'var(--ink)';
          return `<div class="hc" style="background:${bg};color:${fg}"><span class="hk">${esc(x.key)}</span>
            <span class="hv">${PP(v)}</span><span class="hn">${PKR(x.dNet)}</span></div>`;}).join('')}</div>
        <p class="summary" style="margin-top:12px">Share moving toward a category means customers traded into it.

    <div class="card"><h3>Add-on affinity</h3>
      <div class="cap">KPI 49 · how often each add-on group rides along, indexed against total orders</div>

      </tbody></table></div>
      <p class="mini" style="margin-top:8px">Pulse reports items, not baskets, so add-on columns are store-wide rates rather than true
      per-basket pairing. Use them to compare months, not to claim a specific pizza sells a specific dip.</p></div>

    <div class="card"><h3>Attach rates</h3>
      <div class="cap">KPI 25–28, 47 · counts an order twice if it contains two items from the same group, so read the trend more than the level</div>
      <div class="grid g4">
        ${tile(25,'Sides attach', PCT(c.atSides), p?{pct:(c.atSides-p.atSides)/p.atSides,b:p.atSides}:null, pl, PCT)}
        ${tile(26,'Dessert attach', PCT(c.atDess), p?{pct:(c.atDess-p.atDess)/p.atDess,b:p.atDess}:null, pl, PCT)}
        ${tile(27,'Drinks attach', PCT(c.atDrink), p?{pct:(c.atDrink-p.atDrink)/p.atDrink,b:p.atDrink}:null, pl, PCT)}
        ${tile(28,'Dip attach', PCT(c.atDip), p?{pct:(c.atDip-p.atDip)/p.atDip,b:p.atDip}:null, pl, PCT)}
      </div>
      <div class="grid g4" style="margin-top:14px">
        ${tile(46,'Items per order', c.upo.toFixed(2), p?{pct:(c.upo-p.upo)/p.upo,b:p.upo}:null, pl, x=>x.toFixed(2))}
        ${tile(47,'Add-on units per order', c.addonPerOrder.toFixed(2), p?{pct:(c.addonPerOrder-p.addonPerOrder)/(p.addonPerOrder||1),b:p.addonPerOrder}:null, pl, x=>x.toFixed(2))}
        ${tile(48,'Combo / MyBox penetration', PCT(c.comboPen), p?{pct:(c.comboPen-p.comboPen)/(p.comboPen||1),b:p.comboPen}:null, pl, PCT)}
        ${tile(49,'Pizza share of units', PCT(c.pizzaQty/c.units), null)}
      </div>
      <hr class="h">
      <h3 style="font-size:14px">Dip preference</h3>
      ${barChart(c.dips.slice(0,8).map(d=>({key:d.key,value:d.qty})),{fmt:NUM,color:C.tape})}
    </div>

    <div class="card"><h3>Channel</h3><div class="cap">KPI 29–30 · delivery reach and aggregator cost</div>
      <div class="grid g4">
        ${tile(29,'Delivery penetration', PCT(c.deliveryPen), p?{pct:(c.deliveryPen-p.deliveryPen)/p.deliveryPen,b:p.deliveryPen}:null, pl, PCT)}
        ${tile(29,'Aggregator share of orders', PCT(c.aggPen), p?{pct:(c.aggPen-p.aggPen)/(p.aggPen||1),b:p.aggPen}:null, pl, PCT)}
        ${tile(30,'Aggregator fees paid', PKRk(c.aggFees), p?{pct:(c.aggFees-p.aggFees)/(p.aggFees||1),b:p.aggFees}:null, pl, PKRk)}
        ${tile(30,'Fee leakage vs sales', PCT(c.feeLeak,2), p?{pct:(c.feeLeak-p.feeLeak)/(p.feeLeak||1),b:p.feeLeak}:null, pl, x=>PCT(x,2))}
      </div>
    </div>`;
  $('#dlNumbers').onclick=exportNumbersPDF;
  $('#dlCsvAll').onclick=()=>exportCSV();
}
function empty(){ return '<div class="empty"><div class="big">No month loaded</div><p>Go to <b>Files</b> and drop a Pulse Product Mix PDF.</p><button class="btn red" onclick="go(\'upload\')">Load a file</button></div>'; }

<script>
/* =====================================================================
   PAGE: MOVERS  (KPI 7–14, 35–40, 50)
   ===================================================================== */
function pageMovers(){
  const m=M(); if(!m){ $('#p-movers').innerHTML=empty(); return; }
  const c=metrics(m), p=metrics(P()), pl=P()?P().label:'';
  const prevMap = p? new Map(p.sku.map(s=>[s.key,s])) : new Map();
  const curMap  = new Map(c.sku.map(s=>[s.key,s]));

  const moves = c.sku.map(s=>{ const q=prevMap.get(s.key); return {...s, prevNet:q?q.net:0, dNet:s.net-(q?q.net:0), isNew:p&&!q}; });
  const gainers  = [...moves].sort((a,b)=>b.dNet-a.dNet).slice(0,10);
  const decliners= [...moves].sort((a,b)=>a.dNet-b.dNet).slice(0,10);
  const lost     = p? p.sku.filter(s=>!curMap.has(s.key)) : [];
  const churn    = p? (moves.filter(x=>x.isNew).length + lost.length)/c.skuCount : null;

  const tbl=(rows,cols)=>`<div class="tw"><table><thead><tr>${cols.map(x=>'<th class="'+(x[2]||'')+'">'+x[0]+'</th>').join('')}</tr></thead>
    <tbody>${rows.map(r=>'<tr>'+cols.map(x=>'<td class="'+(x[2]?'r mono':'')+'">'+x[1](r)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;

  $('#p-movers').innerHTML=`
    <div class="eyebrow">${esc(m.label)}</div><h1>Movers</h1>
    <p class="lede">What sells, what does not, and what changed since ${pl? '<b>'+esc(pl)+'</b>':'the previous month (not loaded)'}.</p>

    <div class="grid g4" style="margin-bottom:18px">
      ${tile(11,'Items making 80% of sales', NUM(c.p80)+' of '+NUM(c.skuCount), null)}
      ${tile(12,'Long-tail items (under 1% each)', PCT(c.longTail,0), null)}
      ${tile(13,'Revenue per item', PKR(c.revPerSku), null)}
      ${tile(50,'Top 5 items = share of sales', PCT(c.top5Conc), null)}
    </div>

    <div class="grid g2">
      <div class="card"><h3>Top 20 by revenue</h3><div class="cap">KPI 7</div>
        ${barChart(c.topRev.map(s=>({key:s.key,value:s.net})),{fmt:PKRk,color:C.navy})}</div>
      <div class="card"><h3>Top 20 by units</h3><div class="cap">KPI 8</div>
        ${barChart(c.topQty.map(s=>({key:s.key,value:s.qty})),{fmt:NUM,color:C.ink})}</div>
    </div>

    <div class="grid g2">
      <div class="card"><h3>Top 10 gainers</h3><div class="cap">KPI 35 · absolute PKR won vs ${esc(pl||'—')}</div>
        ${p? tbl(gainers,[['Item',r=>esc(r.key)],['Now',r=>PKR(r.net),'r'],['Then',r=>PKR(r.prevNet),'r'],['Δ',r=>'<span class="'+dg(r.dNet)+'">'+PKR(r.dNet)+'</span>','r']]) : '<p class="mini">Load a second month.</p>'}</div>
      <div class="card"><h3>Top 10 decliners</h3><div class="cap">KPI 36</div>
        ${p? tbl(decliners,[['Item',r=>esc(r.key)],['Now',r=>PKR(r.net),'r'],['Then',r=>PKR(r.prevNet),'r'],['Δ',r=>'<span class="'+dg(r.dNet)+'">'+PKR(r.dNet)+'</span>','r']]) : '<p class="mini">Load a second month.</p>'}</div>
    </div>

    <div class="grid g3">
      <div class="card"><h3>New this month</h3><div class="cap">KPI 37</div>
        ${p? (moves.filter(x=>x.isNew).length? tbl(moves.filter(x=>x.isNew).sort((a,b)=>b.net-a.net).slice(0,15),[['Item',r=>esc(r.key)],['Net',r=>PKR(r.net),'r'],['Qty',r=>NUM(r.qty),'r']]) : '<p class="mini">Nothing new.</p>') : '<p class="mini">Load a second month.</p>'}</div>
      <div class="card"><h3>Stopped selling</h3><div class="cap">KPI 38 · sold last month, zero this month</div>
        ${p? (lost.length? tbl(lost.sort((a,b)=>b.net-a.net).slice(0,15),[['Item',r=>esc(r.key)],['Was',r=>PKR(r.net),'r'],['Qty',r=>NUM(r.qty),'r']]) : '<p class="mini">Nothing dropped out.</p>') : '<p class="mini">Load a second month.</p>'}</div>
      <div class="card"><h3>Menu churn</h3><div class="cap">KPI 39–40</div>
        <div class="grid" style="gap:10px">
        ${tile(39,'Menu velocity', PCT(c.velocity,0), null)}
        ${tile(40,'SKU churn rate', churn==null?'—':PCT(churn,1), null)}</div></div>
    </div>

    <div class="card"><h3>Slow movers &amp; delist candidates</h3>
      <div class="cap">KPI 9–10 · 5 units or fewer this month. ${NUM(c.dead.length)} items sold 2 or fewer.</div>
      ${tbl(c.slow,[['Item',r=>esc(r.key)],['Category',r=>esc(r.cat)],['Qty',r=>NUM(r.qty),'r'],['Net',r=>PKR(r.net),'r'],['Unit price',r=>PKR(r.unit),'r']])}
    </div>

    <div class="card"><h3>Efficiency index</h3>
      <div class="cap">KPI 14 · sales-mix share ÷ unit-mix share. Above 1.0 earns more than its volume suggests; below 1.0 is cheap filler.</div>
      ${barChart([...c.sku].filter(s=>s.qty>=10).sort((a,b)=>b.eff-a.eff).slice(0,12).map(s=>({key:s.key,value:+s.eff.toFixed(2)})),{fmt:x=>x.toFixed(2)+'×',color:C.moss})}
      <hr class="h">
      ${barChart([...c.sku].filter(s=>s.qty>=10).sort((a,b)=>a.eff-b.eff).slice(0,8).map(s=>({key:s.key,value:+s.eff.toFixed(2)})),{fmt:x=>x.toFixed(2)+'×',color:C.flame})}
    </div>`;
}

/* =====================================================================
   PAGE: PIZZA  (KPI 19–24, 41–45)
   ===================================================================== */
function pagePizza(){

  const c=metrics(m), p=metrics(P()), pl=P()?P().label:'';
  const sizePrice = c.bySize.map(s=>({key:s.key,value:Math.round(s.unit)}));
  const drift = c.byCat.map(x=>{ const q=p?p.byCat.find(y=>y.key===x.key):null; return {key:x.key,cur:x.unit,prev:q?q.unit:null}; });

  $('#p-pizza').innerHTML=`
    <div class="eyebrow">${esc(m.label)}</div><h1>Pizza mix</h1>
    <p class="lede">Size, crust and flavour are where a Domino's basket is won or lost. Every percentage point of crust
    upgrade is margin you already have on the shelf.</p>

    <div class="grid g4" style="margin-bottom:18px">
      ${tile(21,'Premium crust penetration', PCT(c.premPen), p?{pct:(c.premPen-p.premPen)/(p.premPen||1),b:p.premPen}:null, pl, PCT)}
      ${tile(24,'Pan dependency', PCT(c.panDep), p?{pct:(c.panDep-p.panDep)/(p.panDep||1),b:p.panDep}:null, pl, PCT)}
      ${tile(45,'Premium crust uplift earned', PKRk(c.premUplift), null)}
      ${tile(44,'Upsize opportunity (10% of medium)', PKRk(c.upsizeValue), null)}
    </div>

    <div class="grid g2">
      <div class="card"><h3>Size mix</h3><div class="cap">KPI 19 · share of pizza units</div>
        ${donut(c.bySize.map(s=>({key:s.key,value:s.qty})))}</div>
      <div class="card"><h3>Crust mix</h3><div class="cap">KPI 20 · share of pizza units</div>
        ${barChart(c.byCrust.map(x=>({key:x.key,value:x.qty,color:PREMIUM.indexOf(x.key)>=0?C.tape:C.navy})),{fmt:NUM})}
        <div class="legend"><span><i style="background:${C.tape}"></i>Premium crust</span><span><i style="background:${C.navy}"></i>Standard</span></div></div>
    </div>

    <div class="grid g2">
      <div class="card"><h3>Flavour leaderboard</h3><div class="cap">KPI 22 · all sizes and crusts rolled up</div>
        ${barChart(c.byFlav.map(f=>({key:f.key,value:f.qty})),{fmt:NUM,color:C.flame})}</div>
      <div class="card"><h3>Average price by size</h3><div class="cap">KPI 23</div>
        ${barChart(sizePrice,{fmt:PKR,color:C.ink})}
        <hr class="h">
        <p class="summary">Medium Pan sells at <b>${PKR(c.medUnit)}</b>, Large Pan at <b>${PKR(c.lrgUnit)}</b>.
        Every medium talked up to a large is worth <b>${PKR(c.upsizeDelta)}</b>.
        You sold <b>${NUM(c.medQty)}</b> medium Pan pizzas — moving one in ten adds <b>${PKR(c.upsizeValue)}</b>.</p></div>
    </div>

    <div class="card"><h3>Price drift by category</h3>
      <div class="cap">KPI 41–43 · a falling average price usually means discounting, not a price cut</div>
      <div class="tw" style="max-height:330px"><table><thead><tr><th>Category</th><th class="r">Avg price now</th>
        <th class="r">${esc(pl||'—')}</th><th class="r">Δ</th><th>Read</th></tr></thead><tbody>
        ${drift.map(d=>{ const dd=d.prev? (d.cur-d.prev)/d.prev : null;
          return `<tr><td>${esc(d.key)}</td><td class="r mono">${PKR(d.cur)}</td>
          <td class="r mono">${d.prev==null?'—':PKR(d.prev)}</td>
          <td class="r mono ${dd==null?'':dg(dd)}">${dd==null?'—':(dd*100).toFixed(1)+'%'}</td>
          <td>${dd==null?'—':(dd<-0.10?'<span class="tag t-dog">discount leak</span>':(dd>0.10?'<span class="tag t-star">price up</span>':'<span class="tag t-plow">stable</span>'))}</td></tr>`}).join('')}
      </tbody></table></div></div>

    <div class="card"><h3>Price realization &amp; discount leakage</h3>
      <div class="cap">KPI 42–43 · realized price against the best price this item has ever achieved across your loaded months.

      ${APP.months.length<2? '<div class="note" style="margin-bottom:12px">With one month loaded, list price is taken from this month itself, so nothing can show as leaking. Load more months and this becomes a real discount detector.</div>':''}
      <div class="tw" style="max-height:340px"><table><thead><tr><th>Item</th><th class="r">Realized</th><th class="r">Best ever</th>
        <th class="r">Realization</th><th class="r">Qty</th><th class="r">Value lost</th></tr></thead><tbody>
      ${c.realization.slice(0,25).map(s=>`<tr><td>${esc(s.key)}</td><td class="r mono">${PKR(s.unit)}</td>

        <td class="r mono ${s.real<0.9?'down':(s.real>=0.99?'up':'')}">${PCT(s.real,0)}</td>
        <td class="r mono">${NUM(s.qty)}</td>
        <td class="r mono">${s.real<1? PKR((s.list-s.unit)*s.qty):'—'}</td></tr>`).join('')}
      </tbody></table></div>
      ${c.leaks.length? '<div class="warn" style="margin-top:12px"><b>'+NUM(c.leaks.length)+' items realized under 90% of their best price.</b> Combined shortfall '+PKR(sum(c.leaks,s=>(s.list-s.unit)*s.qty))+' this month.</div>' : '<div class="ok" style="margin-top:12px">No item is realizing under 90% of its best price.</div>'}

    <div class="card"><h3>Crust detail</h3><div class="cap">KPI 20–21 · units, revenue and average price per crust</div>
      <div class="tw"><table><thead><tr><th>Crust</th><th class="r">Units</th><th class="r">Share</th><th class="r">Net</th><th class="r">Avg price</th><th class="r">vs Pan</th></tr></thead><tbody>
      ${c.byCrust.map(x=>`<tr><td>${esc(x.key)} ${PREMIUM.indexOf(x.key)>=0?'<span class="tag t-star">premium</span>':''}</td>
